<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>迷人的危险 · 主歌样片</title>
<style>
@font-face{font-family:'LJBlack';src:url(fonts/black.woff2) format('woff2');font-weight:900}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0}
canvas{width:1920px;height:1080px;display:block;cursor:pointer}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<audio id="au" src="song.mp3" preload="auto"></audio>
<script src="data.js"></script>
<script>
(()=>{
/* 一个连续镜头:所有歌词都放在同一张大画布上,镜头在上面移动,不翻页 */
const W=1920,H=1080,START=17.3,END=44.8,DUR_ALL=75;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FONT='"LJBlack","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif';
const MONO='"Consolas","WenQuanYi Zen Hei Mono","Courier New",monospace';
const C={ink:'#2b211c',paper:'#efe4d6',orange:'#c8553d',teal:'#2f6f73',red:'#b8322a',gray:'#9a8b7e'};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eOut=t=>1-Math.pow(1-t,3);
const eIn=t=>t*t*t;
const eIO=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eBack=t=>{const c=1.9,x=t-1;return 1+(c+1)*x*x*x+c*x*x;};
const rnd=seed=>{let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};};
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function beatInfo(t){
  const B=BEATS;if(t<B[0])return{i:-1,ph:1,pulse:0};
  let lo=0,hi=B.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(B[m]<=t)lo=m;else hi=m-1;}
  const iv=(B[lo+1]||B[lo]+0.44)-B[lo],ph=clamp((t-B[lo])/iv);return{i:lo,ph,pulse:Math.exp(-ph*5)};
}

/* ---------- 演唱时间(和完整版同一套算法) ---------- */
const TM=LYRICS.map((ly,i)=>{
  const flat=ly.s.replace(/\s/g,''),n=flat.length,nextT=LYRICS[i+1]?LYRICS[i+1].t:206;
  const t1=nextT-ly.t<=7.6?nextT:ly.t+6.4;
  const pause=[];{let g=0,sp=false;for(const c of ly.s){if(/\s/.test(c)){sp=g>0;continue;}pause[g++]=sp;sp=false;}}
  const u=[];{let a=0;for(let g=0;g<n;g++){if(pause[g])a+=1.2;u[g]=a;a+=1;}}
  const U=u[n-1]+1,sing=clamp(Math.min(t1-ly.t-0.45,U*0.34),0.4,99);
  return{t0:ly.t,t1,flat,tr:u.map(x=>sing*x/U)};
});
const gt=(i,sub)=>TM[i].t0+TM[i].tr[TM[i].flat.indexOf(sub)];

/* ---------- 词组编排:世界坐标里的位置、进场方式、之后的动作 ---------- */
const G=[
  {l:0,s:'当你的',x:420,y:430,size:190,enter:'slideL'},
  {l:0,s:'泪水',x:420,y:730,size:300,enter:'drop',marker:1},
  {l:0,s:'滑过侧脸',x:1060,y:760,size:170,enter:'slideL',slide:1},
  {l:1,s:'我只能像朋友地',x:1120,y:1560,size:150,enter:'slideL'},
  {l:1,s:'体贴',x:1120,y:1770,size:110,enter:'drop',plate:1},
  {l:2,s:'想揍他一拳',x:1120,y:2010,size:175,enter:'punchR'},
  {l:2,s:'更想叫他',x:1120,y:2250,size:175,enter:'slideL'},
  {l:2,s:'滚远',x:1120+4*172,y:2250,size:175,enter:'scaleIn',solid:1,fly:1},
  {l:3,s:'他',x:3020,y:1880,size:170,enter:'drop',knock:1},
  {l:3,s:'不配',x:3430,y:1930,size:270,enter:'slam'},
  {l:3,s:'站在你眼前',x:3020,y:2260,size:150,enter:'slideL',plate:1},
  {l:4,s:'你的',x:2500,y:420,size:330,enter:'drop'},
  {l:4,s:'痛怎能看不见',x:2500,y:820,size:330,enter:'slideL',circle:1},
];
G.forEach((g,k)=>{g.ta=gt(g.l,g.s)-0.04;g.no=k+1;});
const PUNCH_T=G[5].ta+0.18,KNOCK_T=G[9].ta+0.16,FLY_T=G[7].ta+0.4;

/* ---------- 镜头关键帧:x, y, 缩放, 旋转 ---------- */
const CAM=[
  [17.3,800,560,1.35,-0.04],[18.4,900,560,1.15,-0.02],[21.0,1000,640,1.0,0],[24.6,1360,880,1.0,0.025],
  [25.7,1850,1600,1.0,0],[31.6,1950,1660,1.07,0],[32.3,1900,2020,1.0,0],[FLY_T,1960,2090,1.05,0],
  [FLY_T+0.75,3460,2060,1.0,0.02],[40.6,3500,2090,1.08,0.02],[41.5,2650,1420,0.48,0],[42.3,3380,700,0.62,0],[44.8,3420,720,0.7,0]];
function cam(t){
  let k=0;while(k<CAM.length-2&&CAM[k+1][0]<=t)k++;
  const a=CAM[k],b=CAM[k+1],p=eIO(clamp((t-a[0])/(b[0]-a[0])));
  return{x:lerp(a[1],b[1],p)+Math.sin(t*0.6)*18,y:lerp(a[2],b[2],p)+Math.cos(t*0.5)*12,z:lerp(a[3],b[3],p),r:lerp(a[4],b[4],p)};
}

/* ---------- 世界背景:三块颜色区域,镜头移过边界时颜色自然变化 ---------- */
const CREAM=[[-3000,1200],[2750,1330],[2600,4000],[-3000,4000]];
const TEAL=[[2750,1330],[7000,1180],[7000,4000],[2600,4000]];
const poly=pts=>{ctx.beginPath();pts.forEach(([x,y],k)=>k?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();};
const SHAPES=(()=>{const r=rnd(11),a=[];
  const spots=[[180,220],[1500,260],[1900,520],[260,1050],[2300,900],[700,1350],[2450,1450],[600,2500],[2400,2450],[1700,2650],
    [3100,1500],[4100,1550],[4300,2200],[3300,2600],[2950,250],[4300,300],[4500,1000]];
  spots.forEach(([x,y],k)=>a.push({x,y,type:k%6,size:50+r()*90,dir:r()<0.5?-1:1,ph:r()*6}));return a;})();
function shapeAt(type,x,y,sz,col,rot,lw){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.lineCap='round';
  switch(type){
    case 0:ctx.beginPath();ctx.arc(0,0,sz/2,0,6.283);ctx.fill();break;
    case 1:ctx.beginPath();ctx.arc(0,0,sz/2,0,6.283);ctx.stroke();break;
    case 2:ctx.fillRect(-sz/2,-sz/2,sz,sz);break;
    case 3:ctx.beginPath();ctx.moveTo(0,-sz/2);ctx.lineTo(sz/2,sz/2);ctx.lineTo(-sz/2,sz/2);ctx.closePath();ctx.stroke();break;
    case 4:ctx.fillRect(-sz/2,-sz/7,sz,sz*2/7);ctx.fillRect(-sz/7,-sz/2,sz*2/7,sz);break;
    case 5:ctx.beginPath();for(let k=0;k<=6;k++)ctx.lineTo(-sz/2+k*sz/6,k%2?-sz/5:sz/5);ctx.stroke();break;
  }
  ctx.restore();
}
const regionOf=(x,y)=>{const inP=(pts)=>{let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;};
  return inP(TEAL)?'teal':inP(CREAM)?'cream':'ink';};
const TONE={ink:'#3a2d26',cream:'#e2d2bc',teal:'#285f61'};
const SH=(dark)=>dark?'rgba(0,0,0,.32)':'rgba(43,33,28,.22)'; // 硬投影
function shadowShape(type,x,y,sz,col,rot,lw,dark){shapeAt(type,x+10,y+10,sz,SH(dark),rot,lw);shapeAt(type,x,y,sz,col,rot,lw);}
// 后景视差:以该区域的典型镜头位置为基准,移动速度只有画布的 45%
const par=(bx,by,ax,ay,c)=>[bx+(c.x-ax)*0.45,by+(c.y-ay)*0.45];
function bigOutline(txt,x,y,size,col){ctx.save();ctx.font=`900 ${size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle=col;ctx.lineWidth=12;ctx.strokeText(txt,x,y);ctx.restore();}
function band(a,b,txt,bg,fg,t){ // 沿分界线滚动的细字带
  const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),len=Math.hypot(b[0]-a[0],b[1]-a[1]);
  ctx.save();ctx.translate(a[0],a[1]);ctx.rotate(ang);ctx.fillStyle=bg;ctx.fillRect(0,-24,len,48);
  ctx.fillStyle=fg;ctx.font=`700 26px ${MONO}`;ctx.textBaseline='middle';ctx.textAlign='left';
  const w=ctx.measureText(txt).width;for(let x=-((t*90)%w);x<len;x+=w)ctx.fillText(txt,x,2);ctx.restore();
}
function world(t,be,c){
  // 深咖区域 + 后景
  ctx.fillStyle=C.ink;ctx.fillRect(-3000,-3000,11000,8000);
  {let[x,y]=par(620,330,1000,640,c);ctx.fillStyle=TONE.ink;ctx.beginPath();ctx.arc(x,y,520,0,6.283);ctx.fill();
   [x,y]=par(2150,760,1000,640,c);ctx.beginPath();ctx.arc(x,y,360,0,6.283);ctx.fill();
   [x,y]=par(1250,560,1000,640,c);bigOutline('泪',x,y,1250,TONE.ink);
   [x,y]=par(3500,520,3400,720,c);bigOutline('痛',x,y,1300,TONE.ink);}
  // 往下滴的线(眼泪)
  {const r=rnd(5);for(let k=0;k<14;k++){const x=150+k*180+r()*60,len=120+(t-17)*(18+r()*30)+r()*200,col=k%3?TONE.ink:C.orange;
    ctx.strokeStyle=col;ctx.lineWidth=12;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,-200);ctx.lineTo(x,-200+len);ctx.stroke();
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,-200+len+14,14,0,6.283);ctx.fill();}}
  // 奶茶区域
  ctx.fillStyle=C.paper;poly(CREAM);ctx.fill();
  ctx.save();poly(CREAM);ctx.clip();
  {let[x,y]=par(2300,2350,1900,1700,c);ctx.fillStyle=TONE.cream;ctx.beginPath();ctx.arc(x,y,620,0,6.283);ctx.fill();
   [x,y]=par(1700,1950,1900,1700,c);bigOutline('朋友',x,y,880,TONE.cream);}
  ctx.fillStyle='rgba(43,33,28,.13)';for(let x=-200;x<2900;x+=44)for(let y=1250;y<3000;y+=44)ctx.fillRect(x,y,5,5);
  ctx.strokeStyle='rgba(43,33,28,.10)';ctx.lineWidth=3;for(let y=1300;y<3000;y+=176){ctx.beginPath();ctx.moveTo(-200,y);ctx.lineTo(2900,y);ctx.stroke();}
  ctx.restore();
  // 青绿区域
  ctx.fillStyle=C.teal;poly(TEAL);ctx.fill();
  ctx.save();poly(TEAL);ctx.clip();
  {let[x,y]=par(3650,2000,3460,2060,c);ctx.save();ctx.translate(x,y);ctx.rotate(0.3);ctx.fillStyle=TONE.teal;ctx.fillRect(-520,-520,1040,1040);ctx.restore();
   [x,y]=par(3500,2100,3460,2060,c);bigOutline('不配',x,y,820,TONE.teal);}
  // 警示斜纹带
  ctx.save();ctx.translate(3700,2680);ctx.rotate(-0.06);ctx.fillStyle=C.ink;ctx.fillRect(-1400,-60,2800,120);
  ctx.beginPath();ctx.rect(-1400,-60,2800,120);ctx.clip();ctx.fillStyle=C.orange;const o=(t*60)%120;
  for(let x=-1500+o;x<1500;x+=120){ctx.beginPath();ctx.moveTo(x,-60);ctx.lineTo(x+60,-60);ctx.lineTo(x,60);ctx.lineTo(x-60,60);ctx.closePath();ctx.fill();}ctx.restore();
  // 跟拍子扩散的同心圆
  for(let k=0;k<4;k++){const r=60+k*70+be.pulse*30;ctx.strokeStyle=k%2?C.paper:C.orange;ctx.lineWidth=10;ctx.globalAlpha=1-k*0.2;ctx.beginPath();ctx.arc(4350,1680,r,0,6.283);ctx.stroke();}ctx.globalAlpha=1;
  ctx.restore();
  // 区域分界
  ctx.lineCap='butt';ctx.strokeStyle=C.orange;ctx.lineWidth=34;ctx.beginPath();ctx.moveTo(-3000,1200);ctx.lineTo(2750,1330);ctx.lineTo(7000,1180);ctx.stroke();
  ctx.strokeStyle=C.ink;ctx.lineWidth=26;ctx.beginPath();ctx.moveTo(2750,1330);ctx.lineTo(2600,4000);ctx.stroke();
  band([-3000,1140],[2750,1270],'TEARS · 泪水 · TEARS · 泪水 · ',C.ink,'rgba(239,228,214,.75)',t);
  band([2700,1400],[2560,4000],'FRIEND ZONE · 只能是朋友 · ',C.paper,C.ink,t);
  band([2800,1390],[7000,1240],'GET LOST · 滚远一点 · ',C.teal,'rgba(239,228,214,.8)',t);
  // 奶茶区的聊天气泡和节拍柱
  {const ta=gt(1,'朋友');if(t>ta){const p=eBack(clamp((t-ta)/0.3));ctx.save();ctx.translate(2380,2180);ctx.scale(p,p);
    ctx.fillStyle=SH(false);ctx.beginPath();ctx.roundRect(-150+10,-60+10,300,120,40);ctx.fill();
    ctx.fillStyle='#fff';ctx.strokeStyle=C.ink;ctx.lineWidth=5;ctx.beginPath();ctx.roundRect(-150,-60,300,120,40);ctx.fill();ctx.stroke();
    ctx.fillStyle=C.ink;ctx.font=`900 54px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('在吗？',0,2);ctx.restore();}}
  for(let k=0;k<10;k++){const v=(0.3+0.7*Math.abs(Math.sin(t*2.5+k*0.8)))*(0.35+0.65*be.pulse);ctx.fillStyle=k%3?C.ink:C.orange;ctx.fillRect(1980+k*44,2620-v*200,30,v*200);}
  // 世界里漂浮的几何图形(带投影),踩拍子弹一下
  SHAPES.forEach((s,k)=>{const rg=regionOf(s.x,s.y),col=rg==='ink'?[C.orange,C.teal,C.paper][k%3]:rg==='teal'?[C.paper,C.orange,C.ink][k%3]:[C.orange,C.teal,C.ink][k%3];
    shadowShape(s.type,s.x+Math.sin(t*0.7+s.ph)*16,s.y+Math.cos(t*0.6+s.ph)*14,s.size*(1+0.15*be.pulse),col,t*0.5*s.dir+s.ph,Math.max(7,s.size*0.12),rg!=='cream');});
}
/* ---------- 拼贴小物件:铺满整张画布,自动避开歌词 ---------- */
const LABELS=['SIDE A','TRACK 05','136 BPM','REC ●','DF-01','♪ 00:18','STEREO','NO.05','LIVE','MIX 2'];
const COLLAGE=(()=>{
  const r=rnd(2024),keep=[],avoid=[];
  G.forEach(g=>{const w=[...g.s].length*g.size*0.98;avoid.push([g.x-90,g.y-g.size*0.95,w+180,g.size*1.9]);});
  avoid.push([1780,1680,860,230],[2200,2090,360,180],[1950,2380,480,260]);
  const hit=(x,y,w,h)=>avoid.some(([ax,ay,aw,ah])=>x<ax+aw&&x+w>ax&&y<ay+ah&&y+h>ay)||keep.some(k=>x<k.x+k.w+30&&x+w+30>k.x&&y<k.y+k.h+30&&y+h+30>k.y);
  for(let n=0;n<6000&&keep.length<240;n++){
    const type=Math.floor(r()*12),w=type===1?150:type===2?170:type===6||type===5?150:type===7?180:type===11?220:90,h=type===1?70:type===2?54:type===6||type===5?110:type===7?56:type===11?40:90;
    const x=-300+r()*5000,y=-100+r()*3000,rot=(r()-0.5)*0.5;
    if(hit(x,y,w,h))continue;
    keep.push({x,y,w,h,type,rot,seed:Math.floor(r()*1e6),lab:LABELS[Math.floor(r()*LABELS.length)],ph:r()*6});
  }
  return keep;
})();
function collage(t,be,c){
  const vx0=c.x-W/2/c.z-300,vx1=c.x+W/2/c.z+300,vy0=c.y-H/2/c.z-300,vy1=c.y+H/2/c.z+300;
  for(const it of COLLAGE){
    if(it.x>vx1||it.x+it.w<vx0||it.y>vy1||it.y+it.h<vy0)continue;
    const rg=regionOf(it.x+it.w/2,it.y+it.h/2),dark=rg!=='cream';
    const fg=dark?C.paper:C.ink,acc=rg==='teal'?C.orange:rg==='ink'?C.orange:C.teal,r=rnd(it.seed);
    const bob=Math.sin(t*0.8+it.ph)*6,pop=(it.type===3||it.type===8||it.type===9)?1+0.18*be.pulse:1;
    ctx.save();ctx.translate(it.x+it.w/2,it.y+it.h/2+bob);ctx.rotate(it.rot);ctx.scale(pop,pop);ctx.translate(-it.w/2,-it.h/2);
    const w=it.w,h=it.h;ctx.globalAlpha=0.9;
    switch(it.type){
      case 0: // 裁切线
        ctx.strokeStyle=fg;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,30);ctx.lineTo(0,0);ctx.lineTo(30,0);ctx.moveTo(w,h-30);ctx.lineTo(w,h);ctx.lineTo(w-30,h);
        ctx.moveTo(w/2-14,h/2);ctx.lineTo(w/2+14,h/2);ctx.moveTo(w/2,h/2-14);ctx.lineTo(w/2,h/2+14);ctx.stroke();break;
      case 1: // 条形码
        ctx.fillStyle=dark?C.paper:'#fff';ctx.fillRect(0,0,w,h);ctx.fillStyle=C.ink;for(let x=8;x<w-8;){const bw=2+Math.floor(r()*4)*2;if(r()<0.6)ctx.fillRect(x,6,bw,h-22);x+=bw+2;}
        ctx.font=`700 12px ${MONO}`;ctx.textAlign='center';ctx.fillText('6 921168 50'+(it.seed%90+10),w/2,h-5);break;
      case 2: // 小标签
        ctx.fillStyle=SH(dark);ctx.beginPath();ctx.roundRect(6,6,w,h,h/2);ctx.fill();
        ctx.fillStyle=acc;ctx.beginPath();ctx.roundRect(0,0,w,h,h/2);ctx.fill();
        ctx.fillStyle='#fff';ctx.font=`700 24px ${MONO}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.lab,w/2,h/2+1);break;
      case 3:{ // 星星贴纸
        const R=w/2;ctx.translate(R,R);ctx.rotate(t*0.4);const star=()=>{ctx.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2,rr=k%2?R*0.45:R;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();};
        ctx.translate(6,6);star();ctx.fillStyle=SH(dark);ctx.fill();ctx.translate(-6,-6);star();ctx.fillStyle=C.orange;ctx.fill();break;}
      case 4: // 箭头
        ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(0,h*0.38);ctx.lineTo(w*0.55,h*0.38);ctx.lineTo(w*0.55,h*0.15);ctx.lineTo(w,h/2);ctx.lineTo(w*0.55,h*0.85);ctx.lineTo(w*0.55,h*0.62);ctx.lineTo(0,h*0.62);ctx.closePath();ctx.fill();break;
      case 5: // 棋盘格
        for(let a=0;a<6;a++)for(let b=0;b<4;b++){ctx.fillStyle=(a+b)%2?fg:'rgba(0,0,0,0)';ctx.fillRect(a*w/6,b*h/4,w/6,h/4);}ctx.strokeStyle=fg;ctx.lineWidth=3;ctx.strokeRect(0,0,w,h);break;
      case 6: // 斜纹块
        ctx.save();ctx.beginPath();ctx.rect(0,0,w,h);ctx.clip();ctx.strokeStyle=acc;ctx.lineWidth=10;for(let x=-h;x<w+h;x+=24){ctx.beginPath();ctx.moveTo(x,h);ctx.lineTo(x+h,0);ctx.stroke();}ctx.restore();
        ctx.strokeStyle=fg;ctx.lineWidth=4;ctx.strokeRect(0,0,w,h);break;
      case 7: // 胶带
        ctx.fillStyle=dark?'rgba(239,228,214,.28)':'rgba(200,85,61,.28)';ctx.beginPath();ctx.moveTo(0,0);for(let k=0;k<=4;k++)ctx.lineTo(w,k*h/4+(k%2?6:0));ctx.lineTo(0,h);for(let k=4;k>=0;k--)ctx.lineTo(k%2?-6:0,k*h/4);ctx.closePath();ctx.fill();break;
      case 8: ctx.fillStyle=acc;ctx.font=`900 88px ${FONT}`;ctx.textBaseline='top';ctx.fillText('♪',0,0);break;
      case 9: ctx.fillStyle=C.red;ctx.font=`900 80px ${FONT}`;ctx.textBaseline='top';ctx.fillText('!!',0,0);break;
      case 10: ctx.fillStyle=fg;for(let k=0;k<16;k++){const a=k/16*6.283+t*0.3;ctx.beginPath();ctx.arc(w/2+Math.cos(a)*w*0.42,h/2+Math.sin(a)*h*0.42,4,0,6.283);ctx.fill();}break;
      case 11: // 刻度尺
        ctx.fillStyle=fg;ctx.fillRect(0,h-4,w,4);for(let k=0;k<=22;k++)ctx.fillRect(k*w/22,k%5?h-16:h-32,3,k%5?12:28);break;
    }
    ctx.restore();
  }
}
function echo(g,t){ // 关键词后面的描边回声
  if(!(g.solid||g.marker||g.enter==='slam'||g.circle)||t<g.ta+0.3)return;
  const P=pose(g,t),adv=g.size*0.98,chars=[...g.s],w=chars.length*adv,e=eOut(clamp((t-g.ta-0.3)/0.4));
  const rg=regionOf(g.x,g.y),col=g.enter==='slam'?C.red:rg==='cream'?C.teal:C.orange;
  ctx.save();ctx.font=`900 ${g.size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle=col;ctx.lineWidth=3;
  for(let k=3;k>=1;k--){ctx.save();ctx.globalAlpha=0.5/k*e;ctx.translate(P.x+w/2+k*22*e,P.y+k*22*e);ctx.rotate(P.rot+(g.enter==='slam'?-0.12:0));ctx.translate(-w/2,0);
    chars.forEach((c,j)=>ctx.strokeText(c,adv*(j+0.5),0));ctx.restore();}
  ctx.restore();
}
function nearLayer(t,c){ // 前景碎纸屑:移动比画布快,制造纵深
  const r=rnd(321);
  for(let k=0;k<26;k++){
    const bx=r()*5000,by=r()*3600,sz=14+r()*22,type=Math.floor(r()*6),col=[C.orange,C.teal,C.paper,C.red][k%4];
    const x=((bx-c.x*1.5*c.z)%5000+5000)%5000-1500,y=((by-c.y*1.5*c.z)%3600+3600)%3600-1260;
    if(x<-60||x>W+60||y<-60||y>H+60)continue;
    shapeAt(type,x+8,y+8,sz,'rgba(0,0,0,.25)',t*1.2+k,Math.max(4,sz*0.2));shapeAt(type,x,y,sz,col,t*1.2+k,Math.max(4,sz*0.2));
  }
}

/* ---------- 词组绘制 ---------- */
function burst(x,y,a,col,seed){
  if(a<0||a>0.6)return;const r=rnd(seed);ctx.fillStyle=col;
  for(let k=0;k<10;k++){const ang=r()*6.283,v=300+r()*500,sz=10+r()*16,d=v*(1-Math.exp(-6*a))/6;ctx.globalAlpha=1-a/0.6;ctx.fillRect(x+Math.cos(ang)*d,y+Math.sin(ang)*d,sz,sz);}
  ctx.globalAlpha=1;
}
function pose(g,t){
  const a=t-g.ta;let x=g.x,y=g.y,s=1,sx=1,sy=1,rot=0,al=1;
  if(g.enter==='slideL'){const p=eOut(clamp(a/0.35));x-=(1-p)*420;al=clamp(a/0.12);}
  else if(g.enter==='drop'){const p=clamp(a/0.4);y-=(1-eBack(p))*320;al=clamp(a/0.1);}
  else if(g.enter==='punchR'){const p=clamp(a/0.18);x+=(1-eOut(p))*1200;if(a>0.18){const q=eOut(clamp((a-0.18)/0.25));sx=lerp(1.28,1,q);sy=lerp(0.78,1,q);}}
  else if(g.enter==='scaleIn'){s=lerp(1.9,1,eOut(clamp(a/0.3)));al=clamp(a/0.1);}
  else if(g.enter==='slam'){s=lerp(2.4,1,eOut(clamp(a/0.16)));al=clamp(a/0.06);}
  // 落地之后的动作
  if(g.slide){const k=eIO(clamp((t-g.ta-0.5)/(TM[0].t1-g.ta-0.5)));x+=k*430;y+=k*300;rot+=k*0.2;}
  if(g.fly){const f=t-FLY_T;if(f>0){const p=clamp(f/0.75);x+=eIn(p)*2120;rot+=p*0.55;if(p>=1){const b=clamp((f-0.75)/0.4);y+=eBack(b)*170;rot=lerp(0.55,0.22,eOut(b));}}}
  if(g.knock){const k=t-KNOCK_T;if(k>0){x-=k*300;y+=k*k*1900;rot-=k*2.6;}}
  return{x,y,s,sx,sy,rot,al};
}
function drawGroup(g,t){
  if(t<g.ta)return;
  const a=t-g.ta,adv=g.size*0.98,chars=[...g.s],w=chars.length*adv;
  const rg=regionOf(g.x,g.y),dark=rg!=='cream',face=dark?C.paper:C.ink;
  // 运动拖影
  if(g.slide||g.fly||g.enter==='punchR'){
    for(let k=3;k>=1;k--){const P=pose(g,t-0.045*k),Q=pose(g,t);if(Math.hypot(P.x-Q.x,P.y-Q.y)<6)continue;
      ctx.save();ctx.globalAlpha=0.35/k;ctx.translate(P.x+w/2,P.y);ctx.rotate(P.rot);ctx.scale(P.s*P.sx,P.s*P.sy);ctx.translate(-w/2,0);
      ctx.font=`900 ${g.size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle=g.fly?C.orange:face;ctx.lineWidth=4;
      chars.forEach((c,j)=>ctx.strokeText(c,adv*(j+0.5),0));ctx.restore();}
  }
  const{x,y,s,sx,sy,rot,al}=pose(g,t);
  ctx.save();ctx.globalAlpha=al;ctx.translate(x+w/2,y);ctx.rotate(rot);ctx.scale(s*sx,s*sy);ctx.translate(-w/2,0);
  ctx.font=`900 ${g.size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  // 编号 + 时间码小标注
  if(a>0.25){ctx.save();ctx.globalAlpha=al*clamp((a-0.25)/0.3);ctx.font=`700 24px ${MONO}`;ctx.textAlign='left';ctx.fillStyle=dark?'rgba(239,228,214,.55)':'rgba(43,33,28,.55)';
    const lab=String(g.no).padStart(2,'0')+' — '+fmt(g.ta)+'.'+String(Math.floor((g.ta%1)*100)).padStart(2,'0');
    ctx.fillText(lab,0,-g.size*0.78-(g.enter==='slam'?40:0));ctx.fillRect(0,-g.size*0.78+16-(g.enter==='slam'?40:0),60,3);ctx.restore();}
  if(g.plate){ctx.fillStyle=SH(dark);ctx.beginPath();ctx.roundRect(-g.size*0.25+12,-g.size*0.62+12,w+g.size*0.5,g.size*1.24,14);ctx.fill();
    ctx.fillStyle=dark?C.paper:C.ink;ctx.beginPath();ctx.roundRect(-g.size*0.25,-g.size*0.62,w+g.size*0.5,g.size*1.24,14);ctx.fill();}
  if(g.marker){const m=eOut(clamp((a-0.2)/0.25));ctx.fillStyle=SH(true);ctx.fillRect(-g.size*0.08+14,-g.size*0.56+14,(w+g.size*0.16)*m,g.size*1.12);
    ctx.fillStyle=C.orange;ctx.fillRect(-g.size*0.08,-g.size*0.56,(w+g.size*0.16)*m,g.size*1.12);}
  if(g.enter==='slam'){ // 红章
    const bw=w+g.size*0.5,bh=g.size*1.45;ctx.rotate(-0.12);ctx.strokeStyle=C.red;ctx.lineWidth=16;ctx.beginPath();ctx.roundRect(-g.size*0.25,-bh/2,bw,bh,22);ctx.stroke();
    ctx.lineWidth=5;ctx.beginPath();ctx.roundRect(-g.size*0.25+24,-bh/2+24,bw-48,bh-48,10);ctx.stroke();
  }
  chars.forEach((c,j)=>{
    const cx=adv*(j+0.5);
    if(g.solid){ctx.fillStyle=C.ink;for(let d=12;d>=1;d--)ctx.fillText(c,cx+d,d);ctx.fillStyle=C.orange;}
    else{
      if(!g.plate&&g.enter!=='slam'&&!(g.marker&&a>0.3)){ctx.fillStyle=SH(dark);ctx.fillText(c,cx+Math.max(6,g.size*0.045),Math.max(6,g.size*0.045));}
      if(g.enter==='slam')ctx.fillStyle=C.red;
      else if(g.plate)ctx.fillStyle=dark?C.ink:C.paper;
      else if(g.marker&&a>0.3)ctx.fillStyle=C.paper;
      else if(g.circle&&j===0)ctx.fillStyle=C.orange;
      else ctx.fillStyle=face;
    }
    ctx.fillText(c,cx,0);
  });
  if(g.circle){const e=eOut(clamp((a-0.25)/0.35));if(e>0){ctx.strokeStyle=C.orange;ctx.lineWidth=g.size*0.06;ctx.lineCap='round';ctx.beginPath();
    for(let q=0;q<=60*e;q++){const an=-2.4+q/60*6.283*1.12,wb=1+0.04*Math.sin(q*0.7);ctx.lineTo(adv/2+Math.cos(an)*adv*0.85*wb,Math.sin(an)*g.size*0.78*wb);}ctx.stroke();}}
  ctx.restore();
  burst(g.x+w/2,g.y,a-(g.enter==='punchR'?0.18:g.enter==='slam'?0.16:0.3),g.enter==='slam'?C.red:C.orange,g.ta*100|0);
}
function toggle(t){ // 「朋友/恋人」开关,被“想揍他一拳”撞飞
  const ta=gt(1,'朋友')-0.2;if(t<ta)return;
  let x=2200,y=1790,rot=0;const ap=eBack(clamp((t-ta)/0.35));
  const k=t-PUNCH_T;if(k>0){x+=k*1300;y+=-k*900+k*k*900;rot=k*4;}
  let pos=0;for(const[t0,amt]of[[gt(1,'朋友')+0.6,0.62],[gt(1,'体贴')+0.3,0.42]]){const q=t-t0;if(q<0)continue;pos=q<0.35?amt*eOut(q/0.35):q<0.7?amt*(1-eBack(clamp((q-0.35)/0.35))):0;}
  pos=Math.max(0,pos);
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(ap,ap);
  const tw=380,th=140;ctx.fillStyle=C.ink;ctx.beginPath();ctx.roundRect(-tw/2+10,-th/2+10,tw,th,th/2);ctx.fill();
  ctx.fillStyle=C.gray;ctx.strokeStyle=C.ink;ctx.lineWidth=6;ctx.beginPath();ctx.roundRect(-tw/2,-th/2,tw,th,th/2);ctx.fill();ctx.stroke();
  const kx=lerp(-tw/2+th/2,tw/2-th/2,pos);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(kx,0,th/2-14,0,6.283);ctx.fill();ctx.stroke();
  ctx.font=`900 52px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=C.orange;ctx.fillText('朋友',-tw/2-110,0);ctx.fillStyle='rgba(43,33,28,.35)';ctx.fillText('恋人',tw/2+110,0);
  ctx.restore();
}

/* ---------- 一帧 ---------- */
let prevCam=null;
function renderAt(t){
  t=clamp(t,START,END);const be=beatInfo(t),c=cam(t),c0=cam(t-1/30);
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  ctx.save();ctx.translate(W/2,H/2);ctx.rotate(c.r);ctx.scale(c.z,c.z);ctx.translate(-c.x,-c.y);
  world(t,be,c);
  collage(t,be,c);
  toggle(t);
  G.forEach(g=>echo(g,t));
  G.forEach(g=>drawGroup(g,t));
  ctx.restore();
  nearLayer(t,c);
  // 甩镜时的速度线
  const v=Math.hypot(c.x-c0.x,c.y-c0.y)*c.z;
  if(v>30){const r=rnd(Math.floor(t*30)),n=Math.min(40,v/3);ctx.strokeStyle='rgba(239,228,214,.5)';ctx.lineWidth=4;
    for(let k=0;k<n;k++){const y=r()*H,x=r()*W,l=v*3*(0.5+r());ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+l,y);ctx.stroke();}}
  // 界面
  const ink=regionOf(c.x,c.y)==='cream'?C.ink:C.paper;
  ctx.fillStyle=ink;ctx.globalAlpha=0.6;ctx.font=`900 22px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';
  for(let k=0;k<3;k++){const vv=0.35+0.65*Math.abs(Math.sin(t*3+k*1.7))*(0.4+0.6*be.pulse);ctx.fillRect(40+k*9,44-vv*22,5,vv*22);}
  ctx.fillText('迷人的危险 — Dance Flow',78,34);
  ctx.font=`700 20px ${MONO}`;ctx.fillText(fmt(t)+' / '+fmt(DUR_ALL),40,H-44);
  ctx.globalAlpha=0.18;ctx.fillRect(40,H-24,W-80,4);ctx.globalAlpha=0.85;ctx.fillRect(40,H-24,(W-80)*t/DUR_ALL,4);ctx.globalAlpha=1;
  // 首尾淡入淡出
  const f=Math.max(clamp(1-(t-START)/0.4),clamp((t-END+0.4)/0.4));if(f>0){ctx.fillStyle=`rgba(0,0,0,${f})`;ctx.fillRect(0,0,W,H);}
}
window.renderAt=renderAt;window.RANGE=[START,END];

const rec=/[?&]record/.test(location.search),stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(${-W*s/2}px,${-H*s/2}px) scale(${s})`;}
addEventListener('resize',fit);fit();
window.ready=document.fonts.load('900 100px LJBlack').then(()=>document.fonts.ready).then(()=>{renderAt(START);return true;});
if(rec){stage.style.transform='none';stage.style.left=stage.style.top='0';}
else{
  const au=document.getElementById('au');let raf=0;
  const loop=()=>{const t=au.currentTime;if(t>=END){au.pause();renderAt(END);return;}renderAt(t);raf=requestAnimationFrame(loop);};
  cv.addEventListener('click',()=>{if(au.paused){if(au.currentTime<START||au.currentTime>=END)au.currentTime=START;au.play();loop();}else{au.pause();cancelAnimationFrame(raf);}});
}
})();
</script>
</body>
