<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>迷人的危险 · 主歌样片(柔和版)</title>
<style>
@font-face{font-family:'LJSerifLight';src:url(fonts/serif-light.woff2) format('woff2')}
@font-face{font-family:'LJSerifBold';src:url(fonts/serif-semibold.woff2) format('woff2')}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0}
canvas{width:1920px;height:1080px;display:block;cursor:pointer}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<audio id="au" src="song.mp3" preload="auto"></audio>
<script src="data.js"></script>
<script>
(()=>{
/* 柔和版:浅色底 + 宋体 + 一根细线;每句一种底色,句与句之间用细线完成转场 */
const W=1920,H=1080,START=17.3,END=44.8,DUR_ALL=75;
const cv=document.getElementById('c'),M=cv.getContext('2d');
let ctx=M;
const mk=(w=W,h=H)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c.getContext('2d');};
const bufA=mk(),bufB=mk();
const LIGHT='"LJSerifLight","Noto Serif SC","Songti SC",serif',BOLD='"LJSerifBold","Noto Serif SC","Songti SC",serif';
const INK='#2b211c',SOFT='#6a5a4f',ACC='#b8452f',LINE='rgba(43,33,28,.72)';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eOut=t=>1-Math.pow(1-t,3);
const eIO=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eSine=t=>0.5-0.5*Math.cos(Math.PI*clamp(t));
const rnd=seed=>{let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};};
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};

/* ---------- 演唱时间(和完整版同一套算法) ---------- */
const TM=LYRICS.map((ly,i)=>{
  const flat=ly.s.replace(/\s/g,''),n=flat.length,nextT=LYRICS[i+1]?LYRICS[i+1].t:206;
  const t1=nextT-ly.t<=7.6?nextT:ly.t+6.4;
  const pause=[];{let g=0,sp=false;for(const c of ly.s){if(/\s/.test(c)){sp=g>0;continue;}pause[g++]=sp;sp=false;}}
  const u=[];{let a=0;for(let g=0;g<n;g++){if(pause[g])a+=1.2;u[g]=a;a+=1;}}
  const U=u[n-1]+1,sing=clamp(Math.min(t1-ly.t-0.45,U*0.34),0.4,99);
  return{t0:ly.t,t1,flat,tr:u.map(x=>sing*x/U)};
});
const gt=(i,sub)=>TM[i].t0+TM[i].tr[TM[i].flat.indexOf(sub)];

/* ---------- 每句一个场景:底色 + 排版(屏幕坐标) ---------- */
const BASE=820,CX=W/2;
const SC=[
  {bg:'#f1e9de',groups:[{s:'当你的',x:360,y:330},{s:'泪水',x:330,y:540,k:1},{s:'滑过侧脸',x:840,y:660}]},
  {bg:'#ecd8d0',groups:[{s:'我只能像',x:340,y:320},{s:'朋友',x:320,y:520,k:1},{s:'地体贴',x:840,y:640}]},
  {bg:'#dde1d3',groups:[{s:'想揍他一拳',x:340,y:300},{s:'更想叫他',x:340,y:420},{s:'滚远',x:860,y:590,k:1,drift:1}]},
  {bg:'#e2d9cf',groups:[{s:'他',x:380,y:330},{s:'不配',x:350,y:540,k:1},{s:'站在你眼前',x:840,y:660}]},
  {bg:'#efd3c6',groups:[{s:'你的',x:440,y:330},{s:'痛',x:420,y:550,k:1},{s:'怎能看不见',x:740,y:660}]},
];
SC.forEach((S,i)=>{S.i=i;S.t0=TM[i].t0;S.t1=TM[i].t1;S.groups.forEach(g=>{g.ta=gt(i,g.s);g.size=g.k?240:76;});
  const kg=S.groups.find(g=>g.k);S.key={x:kg.x+kg.size*[...kg.s].length/2,y:kg.y};});
const TR=['threadwipe','iris','slide','split']; // 第 i 句到第 i+1 句的转场
const TDUR=0.95;
SC.forEach((S,i)=>{S.ts=i?SC[i].t0-0.75:START;}); // 转场提前开始,开口时刚好完成

/* ---------- 细线 ---------- */
function path(pts,f){const n=Math.floor((pts.length-1)*clamp(f));if(n<1)return null;ctx.beginPath();ctx.moveTo(...pts[0]);for(let k=1;k<=n;k++)ctx.lineTo(...pts[k]);ctx.stroke();return pts[n];}
const line=(x0,x1,y=BASE,n=200)=>{const a=[];for(let k=0;k<=n;k++)a.push([lerp(x0,x1,k/n),y]);return a;};
function motif(S,t){
  const lt=t-S.ts;
  ctx.save();ctx.strokeStyle=LINE;ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
  let tip=null;
  const run=(pts,t0,t1)=>{const e=path(pts,(t-t0)/(t1-t0));if(e&&t<t1)tip=e;};
  switch(S.i){
    case 0:{ // 泪水:垂下来坠成一滴泪
      const xd=1180,tt=gt(0,'泪水');
      run(line(-20,xd),S.ts,tt+0.2);
      const drop=[];for(let k=0;k<=200;k++){const u=k/200;
        if(u<0.25)drop.push([xd,BASE+60*(u/0.25)]);
        else if(u<0.8){const th=(u-0.25)/0.55*Math.PI*2,r=40;drop.push([xd+r*Math.sin(th)*Math.sin(th/2),BASE+60+r-r*Math.cos(th)]);}
        else drop.push([xd,BASE+60*(1-(u-0.8)/0.2)]);}
      if(t>tt+0.2)run(drop,tt+0.2,tt+1.5);
      if(t>tt+1.5)run(line(xd,W+20),tt+1.5,S.t1);
      break;}
    case 1:{ // 朋友:两条永不相交的平行线
      run(line(-20,W+20),S.ts,S.ts+1.6);
      const a=t-gt(1,'朋友');if(a>0){ctx.strokeStyle=ACC;ctx.beginPath();ctx.moveTo(-20,BASE+26);ctx.lineTo(lerp(-20,W*0.88,eOut(clamp(a/2.2))),BASE+26);ctx.stroke();}
      break;}
    case 2:{ // 滚远:拉紧、发颤、崩断
      const tk=gt(2,'滚远'),snap=tk+0.55,cut=1150;
      if(t<snap){const f=(t-S.ts)/(tk-S.ts),pts=line(-20,W+20).map((p,j)=>[p[0],p[1]+(t>tk?Math.sin(j*0.5+t*40)*2.4*(t-tk)/0.55:0)]);run(pts,S.ts,tk);}
      else{const a=t-snap;
        ctx.beginPath();for(let x=-20;x<cut;x+=8){const back=Math.max(0,x-(cut-300))*eOut(clamp(a/0.5))*0.9,w=x>cut-400?Math.sin(x*0.04-a*12)*12*Math.exp(-a*3):0;x===-20?ctx.moveTo(x-back,BASE+w):ctx.lineTo(x-back,BASE+w);}ctx.stroke();
        ctx.save();ctx.globalAlpha=clamp(1-a/1.4);ctx.beginPath();for(let x=cut;x<W+20;x+=8){const fly=eOut(clamp(a/1.4))*700,w=Math.sin(x*0.04-a*12)*14*Math.exp(-a*3);x===cut?ctx.moveTo(x+fly,BASE+w):ctx.lineTo(x+fly,BASE+w);}ctx.stroke();ctx.restore();}
      break;}
    case 3:{ // 不配:竖起一道门,门缝里的光越来越窄
      const dx=1320,top=230,dw=260,t1=gt(3,'不配');
      const pts=[];for(let k=0;k<=400;k++){const u=k/400*5;pts.push(u<1?[lerp(-20,dx,u),BASE]:u<2?[dx,lerp(BASE,top,u-1)]:u<3?[lerp(dx,dx+dw,u-2),top]:u<4?[dx+dw,lerp(top,BASE,u-3)]:[lerp(dx+dw,W+20,u-4),BASE]);}
      const a=t-t1;if(a>0){const w=dw*(1-eIO(clamp(a/(S.t1-t1))));ctx.fillStyle='rgba(255,250,240,.9)';ctx.fillRect(dx+(dw-w)/2,top,w,BASE-top);
        ctx.fillStyle='rgba(43,33,28,.06)';ctx.beginPath();ctx.moveTo(dx+(dw-w)/2,BASE);ctx.lineTo(dx+(dw+w)/2,BASE);ctx.lineTo(dx+(dw+w)/2+w*1.4,H);ctx.lineTo(dx+(dw-w)/2-w*0.6,H);ctx.closePath();ctx.fill();}
      run(pts,S.ts,t1+0.6);
      break;}
    case 4:{ // 痛:绕成一个圈把“痛”圈住
      const k=S.key,tt=gt(4,'痛');
      run(line(-20,k.x-200,BASE).map((p,j,a)=>[p[0],lerp(BASE,k.y+80,eSine(j/(a.length-1)))]),S.ts,tt);
      const ring=[];for(let q=0;q<=200;q++){const u=q/200,a=Math.PI*0.8+u*Math.PI*2.15,r=180+8*Math.sin(u*9);ring.push([k.x+Math.cos(a)*r*1.05,k.y+Math.sin(a)*r]);}
      if(t>tt)run(ring,tt,tt+1.3);
      if(t>tt+1.3){const tail=[];for(let q=0;q<=200;q++){const u=q/200;tail.push(u<0.3?[lerp(k.x-190,k.x,u/0.3),lerp(k.y+70,BASE,eSine(u/0.3))]:[lerp(k.x,W+20,(u-0.3)/0.7),BASE]);}run(tail,tt+1.3,S.t1);}
      break;}
  }
  if(tip){ctx.fillStyle=INK;ctx.beginPath();ctx.arc(tip[0],tip[1],5,0,6.283);ctx.fill();}
  ctx.restore();
}

/* ---------- 一个场景 ---------- */
/* ---------- 装饰层:剪纸、水印大字、柔光圆、花瓣、竖排小字、细边框 ---------- */
const mix=(a,b,k)=>{const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),A=p(a),B=p(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],k)).toString(16).padStart(2,'0')).join('');};
function paperLayers(S,t){ // 底部三层剪纸波浪,缓慢漂动,带柔和投影
  const tones=[mix(S.bg,INK,0.06),mix(S.bg,INK,0.11),mix(S.bg,INK,0.17)];
  [[880,60,0.0018,12,0.15],[935,46,0.0024,-18,0.25],[990,36,0.003,24,0.35]].forEach(([y0,amp,fq,sp,ph],k)=>{
    ctx.save();ctx.shadowColor='rgba(43,33,28,.18)';ctx.shadowBlur=26;ctx.shadowOffsetY=-6;ctx.fillStyle=tones[k];
    ctx.beginPath();ctx.moveTo(-20,H+20);
    for(let x=-20;x<=W+20;x+=16)ctx.lineTo(x,y0+Math.sin(x*fq+t*0.25*Math.sign(sp)+S.i*1.7+ph*10)*amp+Math.sin(x*fq*2.3+ph*7)*amp*0.35);
    ctx.lineTo(W+20,H+20);ctx.closePath();ctx.fill();ctx.restore();
  });
}
function petals(S,t){ // 少量花瓣慢慢飘落
  const r=rnd(S.i*13+3);
  for(let k=0;k<14;k++){
    const x0=r()*W,sp=30+r()*40,ph=r()*H,sz=8+r()*10,rot=r()*6;
    const y=((ph+t*sp)%(H+80))-40,x=x0+Math.sin(t*0.6+k)*50;
    ctx.save();ctx.translate(x,y);ctx.rotate(rot+t*0.8);ctx.globalAlpha=0.45;ctx.fillStyle=k%3?mix(S.bg,ACC,0.45):'#fff';
    ctx.beginPath();ctx.ellipse(0,0,sz,sz*0.55,0,0,6.283);ctx.fill();ctx.restore();
  }
}
function decorBack(S,t){
  const kg=S.groups.find(g=>g.k),lt=t-S.ts;
  // 水印大字
  ctx.save();ctx.globalAlpha=0.5*clamp(lt/1.2);ctx.fillStyle=mix(S.bg,INK,0.07);ctx.font=`880px ${BOLD}`;ctx.textBaseline='middle';ctx.textAlign='left';
  ctx.fillText(kg.s[0],W*0.5+60-lt*14,H*0.45);ctx.restore();
  // 柔光圆
  const k=S.key,r=260+18*Math.sin(t*1.1);
  const g=ctx.createRadialGradient(k.x,k.y,0,k.x,k.y,r);g.addColorStop(0,mix(S.bg,ACC,0.22)+'cc');g.addColorStop(0.7,mix(S.bg,ACC,0.12)+'66');g.addColorStop(1,mix(S.bg,ACC,0.05)+'00');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(k.x,k.y,r,0,6.283);ctx.fill();
}
function decorFront(S,t){
  // 竖排小字(诗集里的批注)
  const a=t-S.t0;if(a>0){ctx.save();ctx.globalAlpha=0.6*clamp(a/1.2);ctx.fillStyle=SOFT;ctx.font=`30px ${LIGHT}`;ctx.textAlign='center';ctx.textBaseline='middle';
    const txt=TM[S.i].flat;[...txt].forEach((c,j)=>ctx.fillText(c,W-210,230+j*44));ctx.fillRect(W-170,230-20,1,txt.length*44);ctx.restore();}
  // 细边框 + 角标
  ctx.save();ctx.strokeStyle='rgba(43,33,28,.28)';ctx.lineWidth=1.5;ctx.strokeRect(40,40,W-80,H-80);
  ctx.lineWidth=3;ctx.strokeStyle='rgba(43,33,28,.55)';
  for(const[x,y,dx,dy]of[[40,40,1,1],[W-40,40,-1,1],[40,H-40,1,-1],[W-40,H-40,-1,-1]]){ctx.beginPath();ctx.moveTo(x,y+dy*36);ctx.lineTo(x,y);ctx.lineTo(x+dx*36,y);ctx.stroke();}
  ctx.restore();
}
function scene(S,t){
  const lt=t-S.t0;
  ctx.fillStyle=S.bg;ctx.fillRect(0,0,W,H);
  // 很淡的暖光和纸面纹理
  const gx=W*(0.3+0.1*Math.sin(t*0.1)),gr=ctx.createRadialGradient(gx,0,0,gx,0,1400);gr.addColorStop(0,'rgba(255,250,240,.55)');gr.addColorStop(1,'rgba(255,250,240,0)');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  // 镜头:很慢的推近
  const z=1+0.035*clamp((t-S.ts)/(S.t1-S.ts+1));
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2,-H/2);
  decorBack(S,t);paperLayers(S,t);petals(S,t);
  motif(S,t);
  S.groups.forEach(g=>{
    const a=t-g.ta+0.12;if(a<0)return;
    const p=eOut(clamp(a/0.9)),track=lerp(0.45,g.k?0.04:0.16,p);
    ctx.save();ctx.globalAlpha=clamp(a/0.6);ctx.font=`${g.size}px ${g.k?BOLD:LIGHT}`;ctx.textBaseline='middle';ctx.textAlign='left';
    let x=g.x,y=g.y+(1-p)*24;
    if(g.drift){const d=t-(g.ta+0.6);if(d>0){x+=eOut(clamp(d/2.4))*520;ctx.globalAlpha*=1-0.7*clamp(d/2.4);}}
    ctx.fillStyle=g.k?ACC:INK;
    for(const c of g.s){ctx.fillText(c,x,y);x+=g.size*(1+track)+(g.drift&&t>g.ta+0.6?eOut(clamp((t-g.ta-0.6)/2.4))*80:0);}
    ctx.restore();
  });
  // 页码
  const a=t-S.t0+0.4;if(a>0){ctx.save();ctx.globalAlpha=clamp(a)*0.75;ctx.fillStyle=SOFT;ctx.font=`26px ${LIGHT}`;ctx.textBaseline='middle';
    ctx.fillText(String(S.i+1).padStart(2,'0')+'  ·  '+fmt(S.t0),200,190);ctx.fillRect(200,214,1,120);ctx.restore();}
  ctx.restore();
  decorFront(S,t);
}

/* ---------- 转场:都由细线来完成 ---------- */
function withCtx(c,fn){const o=ctx;ctx=c;c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';fn();ctx=o;}
function composite(type,e,A,B,next){
  const g=M;g.save();g.lineCap='round';
  switch(type){
    case 'threadwipe':{ // 细线竖起来扫过画面,扫过的地方换成下一句
      const x=lerp(-40,W+40,eIO(e));g.drawImage(A,0,0);
      g.save();g.beginPath();g.rect(0,0,x,H);g.clip();g.drawImage(B,0,0);g.restore();
      g.strokeStyle=INK;g.lineWidth=3;g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();
      g.fillStyle=INK;g.beginPath();g.arc(x,BASE,7,0,6.283);g.fill();break;}
    case 'iris':{ // 从下一句的关键词处扩开一个圆,边缘一圈细线
      const r=2300*eIO(e),k=next.key;g.drawImage(A,0,0);
      g.save();g.beginPath();g.arc(k.x,k.y,r,0,6.283);g.clip();g.drawImage(B,0,0);g.restore();
      g.strokeStyle=INK;g.lineWidth=3;g.beginPath();g.arc(k.x,k.y,r,0,6.283);g.stroke();
      g.strokeStyle=ACC;g.lineWidth=2;g.beginPath();g.arc(k.x,k.y,r*0.92,0,6.283);g.stroke();break;}
    case 'slide':{ // 整个画面被推走,带一点视差
      const s=eIO(e);g.drawImage(A,-W*0.55*s,0);
      g.fillStyle='rgba(43,33,28,.18)';g.fillRect(W*(1-s)-30,0,30,H);
      g.drawImage(B,W*(1-s),0);
      g.strokeStyle=INK;g.lineWidth=3;g.beginPath();g.moveTo(W*(1-s),0);g.lineTo(W*(1-s),H);g.stroke();break;}
    case 'split':{ // 沿着细线上下裂开,露出下一句
      const s=eIO(e),d=H*0.62*s;g.drawImage(B,0,0);
      g.save();g.beginPath();g.rect(0,0,W,BASE);g.clip();g.drawImage(A,0,-d);g.restore();
      g.save();g.beginPath();g.rect(0,BASE,W,H-BASE);g.clip();g.drawImage(A,0,d*0.5);g.restore();
      g.strokeStyle=INK;g.lineWidth=3;g.beginPath();g.moveTo(0,BASE-d);g.lineTo(W,BASE-d);g.moveTo(0,BASE+d*0.5);g.lineTo(W,BASE+d*0.5);g.stroke();break;}
  }
  g.restore();
}

/* ---------- 质感 ---------- */
const GRAIN=[0,1,2,3].map(s=>{const g=mk(480,270),d=g.createImageData(480,270),r=rnd(s+11);
  for(let k=0;k<d.data.length;k+=4){const v=r()*255;d.data[k]=d.data[k+1]=d.data[k+2]=v;d.data[k+3]=255;}g.putImageData(d,0,0);return g.canvas;});
const VIG=(()=>{const g=mk(),gr=g.createRadialGradient(W/2,H/2,H*0.45,W/2,H/2,H*1.1);gr.addColorStop(0,'rgba(60,40,30,0)');gr.addColorStop(1,'rgba(60,40,30,.22)');g.fillStyle=gr;g.fillRect(0,0,W,H);return g.canvas;})();

function renderAt(t){
  t=clamp(t,START,END);
  M.setTransform(1,0,0,1,0,0);M.globalAlpha=1;
  let k=0;while(k<SC.length-1&&t>=SC[k+1].ts)k++;
  const S=SC[k];
  if(k>0&&t<S.ts+TDUR){
    withCtx(bufA,()=>scene(SC[k-1],t));withCtx(bufB,()=>scene(S,t));
    composite(TR[k-1],clamp((t-S.ts)/TDUR),bufA.canvas,bufB.canvas,S);
  }else withCtx(M,()=>scene(S,t));
  M.drawImage(VIG,0,0);
  M.fillStyle=SOFT;M.globalAlpha=0.8;M.font=`22px ${LIGHT}`;M.textBaseline='middle';M.textAlign='left';M.fillText('迷人的危险 · Dance Flow',60,H-56);
  M.textAlign='right';M.fillText(fmt(t)+' / '+fmt(DUR_ALL),W-60,H-56);
  M.globalAlpha=0.3;M.fillRect(60,H-30,W-120,1);M.globalAlpha=0.8;M.fillRect(60,H-30,(W-120)*t/DUR_ALL,1);M.globalAlpha=1;
  const f=Math.max(clamp(1-(t-START)/0.6),clamp((t-END+0.6)/0.6));if(f>0){M.fillStyle=`rgba(241,233,222,${f})`;M.fillRect(0,0,W,H);}
}
window.renderAt=renderAt;

const rec=/[?&]record/.test(location.search),stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(${-W*s/2}px,${-H*s/2}px) scale(${s})`;}
addEventListener('resize',fit);fit();
window.ready=Promise.all([document.fonts.load("72px LJSerifLight"),document.fonts.load("72px LJSerifBold")]).then(()=>document.fonts.ready).then(()=>{renderAt(START);return true;});
if(rec){stage.style.transform='none';stage.style.left=stage.style.top='0';}
else{
  const au=document.getElementById('au');let raf=0;
  const loop=()=>{const t=au.currentTime;if(t>=END){au.pause();renderAt(END);return;}renderAt(t);raf=requestAnimationFrame(loop);};
  cv.addEventListener('click',()=>{if(au.paused){if(au.currentTime<START||au.currentTime>=END)au.currentTime=START;au.play();loop();}else{au.pause();cancelAnimationFrame(raf);}});
}
})();
</script>
</body>
</html>
