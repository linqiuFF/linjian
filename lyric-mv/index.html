<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>迷人的危险 · 歌词动画</title>
<style>
@font-face{font-family:'LJBlack';src:url(fonts/black.woff2) format('woff2');font-weight:900}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'LJBlack','PingFang SC','Microsoft YaHei',sans-serif}
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0}
canvas{width:1920px;height:1080px;display:block}
#cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  background:rgba(8,4,14,.78);color:#fff;cursor:pointer;transition:opacity .3s}
#cover.hide{opacity:0;pointer-events:none}
#cover img{width:320px;height:320px;border-radius:18px;box-shadow:0 20px 80px rgba(176,124,255,.45)}
#cover h1{margin:0;font-size:84px;letter-spacing:10px;text-shadow:0 0 30px #ff3d8b}
#cover p{margin:0;font-size:34px;opacity:.7;letter-spacing:8px}
#cover b{display:inline-block;margin-top:10px;padding:18px 56px;border-radius:60px;border:3px solid #ff3d8b;box-shadow:0 0 24px #ff3d8b;font-size:40px;font-weight:900}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="cover"><img src="cover.jpg" alt=""><h1>迷人的危险</h1><p>DANCE FLOW</p><b>▶ 点击播放</b></div>
</div>
<audio id="au" src="song.mp3" preload="auto"></audio>
<script src="data.js"></script>
<script>
(()=>{
const W=1920,H=1080,DUR=206.01;
const cv=document.getElementById('c'),M=cv.getContext('2d');
let ctx=M; // 当前绘制目标;转场时会临时切到离屏画布
const mk=(w=W,h=H)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c.getContext('2d');};
const bufP=mk(),bufN=mk(),bufT=mk();
const FONT='"LJBlack","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif';
const MONO='"Consolas","WenQuanYi Zen Hei Mono","Courier New",monospace';
const C={mag:'#ff3d8b',vio:'#b07cff',cyan:'#4de1ff',pink:'#ffb4dc',white:'#f6f0ff',base:'#09050f',red:'#ff4058'};
const RGB={mag:'255,61,139',vio:'176,124,255',cyan:'77,225,255',pink:'255,180,220'};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eOut=t=>1-Math.pow(1-t,3);
const eIn=t=>t*t*t;
const eIO=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const rnd=seed=>{let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};};
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const hash=(a,b)=>{const r=rnd(Math.floor(a*1000)*31+b);return r();};

/* ---------- 节拍 ---------- */
function beatInfo(t){
  const B=BEATS;
  if(t<B[0])return{i:-1,ph:1,pulse:0};
  let lo=0,hi=B.length-1;
  while(lo<hi){const m=(lo+hi+1)>>1;if(B[m]<=t)lo=m;else hi=m-1;}
  const iv=(B[lo+1]||B[lo]+0.44)-B[lo];
  const ph=clamp((t-B[lo])/iv);
  return{i:lo,ph,pulse:Math.exp(-ph*5)};
}

/* ---------- 段落:主歌收着,副歌炸开,快节奏段暗色快切 ---------- */
const SECT=i=>i<=4?'verse':i<=11?'chorus':i<=17?'verse':i<=24?'chorus':i<=33?'bridge':'chorus';
/* 版式:cs居中小字 sl左下堆叠 sp对角分布 vr竖排 hero关键词巨字 ns霓虹灯牌 rp快切大字 dg对话框 */
const LAY=['sl','cs','sp','vr','cs', 'hero','hero','ns','sl','cs','sl','hero',
 'vr','ns','cs','sp','vr','cs', 'hero','hero','ns','sl','cs','sl','hero',
 'rp','rp','rp','rp','rp','rp','rp','dg','sl', 'hero','hero','ns','sl','cs','sl','hero','hero'];
const TR=['textzoom','leak','whip','blur','leak', 'bars','glitch','cut','rings','leak','blur','textzoom',
 'flip','cut','blur','whip','leak','split', 'bars','glitch','cut','rings','leak','blur','textzoom',
 'rings','cut','glitch','cut','pixel','cut','glitch','pixel','blur', 'textzoom','glitch','cut','rings','leak','blur','bars','flip'];
const TD={whip:.45,blur:.6,leak:.6,split:.55,bars:.6,textzoom:.75,glitch:.3,rings:.6,pixel:.5,cut:.2,flip:.5};
const KEY=['危险','残缺','痛','滚远','淹灭','死结','欺骗','抱歉','泪水','绝望','孤单','暗恋','特别','迷人','沉重','爱','抉择'];
/* 图形元素:按歌词意思匹配 */
const FXMAP=[['泪水','tear'],['朋友','parallel'],['滚远','shards'],['不配站在','door'],['看不见','ecg'],['危险','warn'],['残缺','ring'],
 ['那么痛','ecg'],['锐利','shards'],['好多年','clock'],['淹灭','water'],['死结','knot'],['欺骗','glitchy'],['界线','boundary'],
 ['特别','spot'],['梦里','dream'],['沉重','sink'],['抱歉','none']];
const LOG=['> heart.exe --status','[warn] 心跳过载 · 136 bpm','[error] 抉择失败','> retry --love'];

function splitRows(s,maxLen=7){
  const out=[];
  for(const ph of s.split(/\s+/).filter(Boolean)){
    const ch=[...ph];
    if(ch.length>maxLen){
      const k=Math.ceil(ch.length/6),cuts=[];let prev=0;
      for(let r=1;r<k;r++){
        const ideal=Math.round(ch.length*r/k);let best=ideal,bs=-9;
        for(let p=Math.max(prev+2,ideal-2);p<=Math.min(ch.length-2,ideal+2);p++){
          let sc=-Math.abs(p-ideal);
          if('的了着地得里'.includes(ch[p-1]))sc+=3;
          if(ch.slice(p-3,p).join('')==='为什么')sc+=3;
          if('的了着地得'.includes(ch[p]))sc-=3;
          if(sc>bs){bs=sc;best=p;}
        }
        cuts.push(best);prev=best;
      }
      let a=0;for(const c of [...cuts,ch.length]){out.push(ch.slice(a,c).join(''));a=c;}
    }else out.push(ph);
  }
  return out;
}

/* ---------- 预先排版 ---------- */
const LN=LYRICS.map((ly,i)=>{
  const lay=LAY[i]||'cs',sect=SECT(i),flat=ly.s.replace(/\s/g,''),nch=flat.length;
  const en=sect==='chorus'?1:sect==='bridge'?0.75:0.4;
  const acc=sect==='chorus'?C.mag:sect==='bridge'?[C.cyan,C.mag,C.vio][i%3]:C.vio;
  const glow=sect==='chorus'?RGB.mag:sect==='bridge'?[RGB.cyan,RGB.mag,RGB.vio][i%3]:RGB.vio;
  const fx=(FXMAP.find(([k])=>flat.includes(k))||[,''])[1];
  const em=new Array(nch).fill(false);let hero=null;
  for(const k of KEY){let p=-1;while((p=flat.indexOf(k,p+1))>=0){for(let j=0;j<k.length;j++)em[p+j]=true;if(!hero||k.length>hero.w.length)hero={w:k,g:p};}}
  // 卡拉OK填色时间
  const nextT=LYRICS[i+1]?LYRICS[i+1].t:DUR;
  const t1=nextT-ly.t<=7.6?nextT:ly.t+6.4;
  const pause=[];{let g=0,sp=false;for(const c of ly.s){if(/\s/.test(c)){sp=g>0;continue;}pause[g++]=sp;sp=false;}}
  const u=[];{let acc2=0;for(let g=0;g<nch;g++){if(pause[g])acc2+=1.2;u[g]=acc2;acc2+=1;}}
  const U=u[nch-1]+1,sing=clamp(Math.min(t1-ly.t-0.45,U*0.34),0.4,99);
  const rows=splitRows(ly.s,lay==='vr'?9:7).map(r=>[...r]);
  const R=rows.length,maxN=Math.max(...rows.map(r=>r.length));
  let size,adv,lh,vert=false,place;
  const chars=[],rb=[];
  if(lay==='vr'){
    vert=true;size=Math.min(120,780/(maxN*1.12));adv=size*1.12;lh=size*1.7;
    place=(k,j,n)=>[W-300-k*lh,190+adv*(j+0.5)];
  }else{
    const cap={cs:130,sl:150,sp:150,hero:78,ns:210,rp:240,dg:150}[lay];
    const track={cs:1.14,sl:1.04,sp:1.04,hero:1.3,ns:1.06,rp:1.0,dg:1.0}[lay];
    size=Math.min(cap,1560/(maxN*track));adv=size*track;lh=size*(lay==='hero'?1.6:1.32);
    place=(k,j,n)=>{
      const rw=n*adv;let x0,y;
      if(lay==='cs'||lay==='ns'||lay==='hero'){x0=(W-rw)/2;y=(lay==='hero'?230:H/2-10)-R*lh/2+lh*(k+0.5);}
      else if(lay==='sl'||lay==='dg'){x0=160;y=(lay==='dg'?H/2:H-210)-(R-k-0.5)*lh;}
      else if(lay==='sp'||lay==='rp'){
        if(R===1){x0=(W-rw)/2;y=H/2-10;}
        else{x0=k%2?W-160-rw:160;y=lerp(330,H-300,R===1?0.5:k/(R-1));}
      }
      return[x0+adv*(j+0.5),y];
    };
  }
  let g=0;
  rows.forEach((row,k)=>{
    let bx0=1e9,by0=1e9,bx1=-1e9,by1=-1e9;
    row.forEach((c,j)=>{
      const[x,y]=place(k,j,row.length);
      chars.push({c,x,y,emph:em[g],g,tr:sing*u[g]/U,cd:sing/U,k});
      bx0=Math.min(bx0,x-size*0.7);by0=Math.min(by0,y-size*0.75);bx1=Math.max(bx1,x+size*0.7);by1=Math.max(by1,y+size*0.75);g++;
    });
    rb.push({x:bx0,y:by0,w:bx1-bx0,h:by1-by0});
  });
  return{i,t0:ly.t,t1,lay,sect,en,acc,glow,fx,size,adv,lh,vert,rows,chars,rb,R,text:ly.s,flat,hero,
    heroT:hero?chars[hero.g].tr:0,heroEnd:hero?chars[hero.g+hero.w.length-1].tr+chars[hero.g].cd:0,
    drift:(i%2?1:-1)*7};
});
const LAST_END=LN[LN.length-1].t1;

/* ---------- 氛围层 ---------- */
function bokeh(t,en,n=18,seed=31,big=1){
  const r=rnd(seed);
  for(let k=0;k<n;k++){
    const x0=r()*W,y0=r()*H,rad=(30+r()*110)*big,sp=r()*14+4,c=[RGB.mag,RGB.vio,RGB.cyan,RGB.pink][k%4];
    const x=((x0+t*sp)%(W+300))-150,y=y0+Math.sin(t*0.3+k)*40;
    const a=(0.05+0.09*en)*(0.6+0.4*Math.sin(t*0.7+k*1.3));
    const gr=ctx.createRadialGradient(x,y,0,x,y,rad);
    gr.addColorStop(0,`rgba(${c},${a})`);gr.addColorStop(0.65,`rgba(${c},${a*0.55})`);gr.addColorStop(1,`rgba(${c},0)`);
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,rad,0,6.283);ctx.fill();
  }
}
function atmos(t,be,en,tone=0){
  ctx.fillStyle=C.base;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  [[0.28,0.32,RGB.vio],[0.76,0.62,RGB.mag],[0.5,0.95,'60,110,255']].forEach(([bx,by,c],k)=>{
    const x=W*(bx+0.09*Math.sin(t*0.13+k*2)),y=H*(by+0.08*Math.cos(t*0.11+k)),rr=720+140*Math.sin(t*0.2+k);
    const a=(0.09+0.15*en)*(k===tone?1.35:0.8)+0.07*en*be.pulse;
    const gr=ctx.createRadialGradient(x,y,0,x,y,rr);gr.addColorStop(0,`rgba(${c},${a})`);gr.addColorStop(1,`rgba(${c},0)`);
    ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  });
  bokeh(t,en);
  ctx.restore();
}
function leakFx(t,en){ // 漏光:偶尔从画面边缘渗进来的暖光
  const a=Math.max(0,Math.sin(t*0.37))*Math.max(0,Math.sin(t*0.23+1))*(0.25+0.3*en);
  if(a<0.01)return;
  ctx.save();ctx.globalCompositeOperation='screen';
  const x=W*(0.5+0.6*Math.sin(t*0.17)),gr=ctx.createRadialGradient(x,-80,0,x,-80,900);
  gr.addColorStop(0,`rgba(255,150,120,${a})`);gr.addColorStop(0.5,`rgba(255,61,139,${a*0.4})`);gr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);ctx.restore();
}
function eqBars(t,be,h,col){
  const n=64,bw=W/n;ctx.fillStyle=col;
  for(let k=0;k<n;k++){
    const v=(0.5+0.5*Math.sin(t*(2.2+k%5*0.7)+k*1.3))*(0.4+0.6*be.pulse)*(0.6+0.4*Math.sin(k*0.4+t*0.8));
    const hh=Math.max(2,h*v);ctx.fillRect(k*bw+bw*0.42,H-hh,bw*0.16,hh);
  }
}
// 胶片颗粒和暗角:预先生成,每帧随机取一张
const GRAIN=[0,1,2,3].map(s=>{const g=mk(480,270),d=g.createImageData(480,270),r=rnd(s+11);
  for(let k=0;k<d.data.length;k+=4){const v=r()*255;d.data[k]=d.data[k+1]=d.data[k+2]=v;d.data[k+3]=255;}g.putImageData(d,0,0);return g.canvas;});
const VIG=(()=>{const g=mk(),gr=g.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*1.05);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.72)');g.fillStyle=gr;g.fillRect(0,0,W,H);return g.canvas;})();

/* ---------- 霓虹字 ---------- */
function neonText(txt,x,y,size,col,glow,on=1,core=true){
  if(on<=0)return;
  ctx.save();ctx.font=`900 ${size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.globalAlpha*=on;ctx.lineJoin='round';
  ctx.shadowColor=`rgba(${glow},1)`;ctx.shadowBlur=size*0.22;
  ctx.strokeStyle=col;ctx.lineWidth=Math.max(3,size*0.035);ctx.strokeText(txt,x,y);
  ctx.shadowBlur=size*0.08;ctx.strokeText(txt,x,y);
  if(core){ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,245,255,.9)';ctx.lineWidth=Math.max(1.2,size*0.012);ctx.strokeText(txt,x,y);}
  ctx.restore();
}
// 灯管点亮时的闪烁
function flick(age,seed){
  if(age<0)return 0;
  if(age<0.4){const k=Math.floor(age*30);return hash(k,seed)<0.25+age*1.8?1:0.15;}
  return 1;
}

/* ---------- 图形元素 ---------- */
function fxDraw(L,lt,t,be,front){
  const c=L.acc,g=L.glow;
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  switch(L.fx){
    case 'tear':if(front)break;{ // 泪滴落下,在地面荡开涟漪
      for(const[t0,x]of[[0.3,W*0.72],[2.6,W*0.58]]){
        const a=lt-t0;if(a<0)continue;
        const fall=clamp(a/1.1),y=lerp(-80,790,eIn(fall));
        if(fall<1){
          ctx.strokeStyle=`rgba(${RGB.cyan},.35)`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,Math.max(0,y-260));ctx.lineTo(x,y-30);ctx.stroke();
          ctx.shadowColor=C.cyan;ctx.shadowBlur=30;ctx.fillStyle='rgba(220,250,255,.95)';
          ctx.beginPath();ctx.moveTo(x,y-46);ctx.bezierCurveTo(x+6,y-30,x+22,y-8,x+22,y+6);ctx.arc(x,y+6,22,0,Math.PI);ctx.bezierCurveTo(x-22,y-8,x-6,y-30,x,y-46);ctx.fill();
        }else{
          const b=a-1.1;
          for(let k=0;k<3;k++){const p=clamp((b-k*0.25)/1.6);if(p<=0||p>=1)continue;
            ctx.strokeStyle=`rgba(${RGB.cyan},${(1-p)*0.8})`;ctx.lineWidth=3;ctx.shadowColor=C.cyan;ctx.shadowBlur=16;
            ctx.beginPath();ctx.ellipse(x,790,40+p*420,(40+p*420)*0.16,0,0,6.283);ctx.stroke();}
        }
      }
      break;}
    case 'parallel':if(front)break;{ // 两条永不相交的平行线
      const p=eOut(clamp(lt/1.8));
      [[H/2+150,C.vio,RGB.vio],[H/2+200,C.mag,RGB.mag]].forEach(([y,col,gg],k)=>{
        ctx.strokeStyle=col;ctx.lineWidth=4;ctx.shadowColor=`rgb(${gg})`;ctx.shadowBlur=22;
        ctx.beginPath();for(let x=0;x<=W*p;x+=20)ctx.lineTo(x,y+Math.sin(x*0.006+t*1.2+k)*10);ctx.stroke();
      });
      break;}
    case 'shards':if(!front)break;{ // 碎玻璃慢镜头飞散
      const a=lt-Math.max(0,L.heroT-0.1);if(a<0)break;
      const r=rnd(L.i*7+5);
      for(let k=0;k<16;k++){
        const ang=r()*6.283,v=120+r()*380,sz=40+r()*120,rot=(r()-0.5)*1.4,cx=W/2+(r()-0.5)*300,cy=H/2+(r()-0.5)*200;
        const d=v*Math.log(1+a*2),x=cx+Math.cos(ang)*d,y=cy+Math.sin(ang)*d;
        const al=clamp(1-a/4)*0.9;if(al<=0)continue;
        ctx.save();ctx.translate(x,y);ctx.rotate(rot*a+ang);
        ctx.beginPath();ctx.moveTo(0,-sz*0.6);ctx.lineTo(sz*0.35,sz*0.4);ctx.lineTo(-sz*0.3,sz*0.25);ctx.closePath();
        ctx.fillStyle=`rgba(255,255,255,${0.06*al})`;ctx.fill();
        ctx.strokeStyle=`rgba(${k%2?RGB.mag:'255,255,255'},${al})`;ctx.lineWidth=2;ctx.shadowColor=c;ctx.shadowBlur=14;ctx.stroke();
        ctx.restore();
      }
      break;}
    case 'door':if(front)break;{ // 门缝里的光越来越窄
      const dx=560,dy=200,dw=380,dh=640,open=dw*(1-eIO(clamp((lt-0.6)/(L.t1-L.t0-0.8))));
      ctx.fillStyle='rgba(255,220,240,.10)';ctx.beginPath();ctx.moveTo(dx,dy+dh);ctx.lineTo(dx+open,dy+dh);ctx.lineTo(dx+open*2.4-200,H);ctx.lineTo(dx-260,H);ctx.closePath();ctx.fill();
      const gr=ctx.createLinearGradient(dx,0,dx+dw,0);gr.addColorStop(0,'rgba(255,230,245,.85)');gr.addColorStop(1,'rgba(255,120,190,.5)');
      ctx.shadowColor=C.pink;ctx.shadowBlur=60;ctx.fillStyle=gr;ctx.fillRect(dx,dy,open,dh);
      ctx.shadowBlur=18;ctx.strokeStyle=`rgba(${RGB.pink},.7)`;ctx.lineWidth=4;ctx.strokeRect(dx,dy,dw,dh);
      break;}
    case 'ecg':if(front)break;{ // 心电图,唱到“痛”时猛跳
      const y0=H-230,span=W,hd=clamp(lt/2.2),spike=L.flat.includes('痛');
      ctx.strokeStyle=c;ctx.lineWidth=4;ctx.shadowColor=`rgb(${g})`;ctx.shadowBlur=20;
      ctx.beginPath();
      for(let x=0;x<=span*hd;x+=6){
        const ph=(x%320)/320;let v=0;
        if(ph>0.42&&ph<0.46)v=-30;else if(ph>0.46&&ph<0.5)v=(spike?220:120)*(1-Math.abs(ph-0.48)/0.02);else if(ph>0.5&&ph<0.54)v=-60;else if(ph>0.6&&ph<0.7)v=18*Math.sin((ph-0.6)/0.1*Math.PI);
        ctx.lineTo(x,y0-v);
      }
      ctx.stroke();
      const hx=span*hd;ctx.fillStyle='#fff';ctx.shadowBlur=30;ctx.beginPath();ctx.arc(hx,y0,7,0,6.283);ctx.fill();
      break;}
    case 'warn':if(front)break;{ // 警示三角
      const on=flick(lt-L.heroT+0.2,L.i);if(!on)break;
      ctx.globalAlpha=on*0.55;ctx.translate(W/2,H/2+95);ctx.rotate(Math.sin(t*0.3)*0.04);
      ctx.strokeStyle=c;ctx.lineWidth=6;ctx.shadowColor=`rgb(${g})`;ctx.shadowBlur=40;
      ctx.beginPath();ctx.moveTo(0,-430);ctx.lineTo(470,380);ctx.lineTo(-470,380);ctx.closePath();ctx.stroke();
      break;}
    case 'ring':if(front)break;{ // 光环断开,碎片掉落
      const br=eOut(clamp((lt-L.heroEnd)/0.6)),cx=W/2,cy=H/2+90,R=400;
      ctx.strokeStyle=c;ctx.lineWidth=7;ctx.shadowColor=`rgb(${g})`;ctx.shadowBlur=36;
      const gap=br*0.5,drop=br*60;
      ctx.beginPath();ctx.arc(cx-br*40,cy+drop*0.3,R,-Math.PI/2+gap,Math.PI/2-gap*0.6,true);ctx.stroke();
      ctx.beginPath();ctx.arc(cx+br*40,cy+drop,R,-Math.PI/2+gap*0.4,Math.PI/2-gap);ctx.stroke();

/* ---------- 歌词:整行遮罩滑入 + 卡拉OK填色(霓虹辉光) ---------- */

      const sc=ch.emph&&age>0?1+0.12*Math.exp(-age*6):1;

/* ---------- 转场合成 ---------- */
const CELLS=(()=>{const r=rnd(4242),a=[];for(let y=0;y<14;y++)for(let x=0;x<24;x++)a.push({x:x*80,y:y*80,th:r()*0.8});return a;})();

      g.fillStyle='#000';g.fillRect(0,0,W,H);

      }

    case 'blur':{ // 模糊溶解

      cols.forEach((col,k)=>{
        const x=(W+sk)*eOut(clamp((e-k*0.09)/0.62));if(x<=0)return;
        g.save();g.beginPath();g.moveTo(-sk,0);g.lineTo(x,0);g.lineTo(x-sk,H);g.lineTo(-sk,H);g.closePath();
        if(col){g.fillStyle=col;g.fill();}else{g.clip();g.drawImage(B,0,0);}
        g.restore();
      });
      break;}
    case 'rings':{ // 光环扩散
      g.drawImage(A,0,0);const cols=['#3a1470',acc,'#14081f',null];
      cols.forEach((col,k)=>{
        const r=1150*eIO(clamp((e-k*0.1)/0.62));if(r<=0)return;
        g.save();g.beginPath();g.arc(W/2,H/2,r,0,6.283);
        if(col){g.fillStyle=col;g.fill();}else{g.clip();g.drawImage(B,0,0);}
        g.restore();
      });
      break;}
    case 'textzoom':{ // 镜头从关键词的笔画里穿过去
      g.drawImage(A,0,0);
      const s=Math.pow(60,eIn(e));
      withCtx(bufT,()=>{
        bufT.clearRect(0,0,W,H);bufT.drawImage(B,0,0);
        bufT.globalCompositeOperation='destination-in';
        bufT.font=`900 760px ${FONT}`;bufT.textAlign='center';bufT.textBaseline='middle';
        bufT.translate(W/2,H/2);bufT.scale(s,s);bufT.fillText(S.zch,0,0);
      });
      g.drawImage(bufT.canvas,0,0);
      g.save();g.translate(W/2,H/2);g.scale(s,s);g.font=`900 760px ${FONT}`;g.textAlign='center';g.textBaseline='middle';
      g.shadowColor=acc;g.shadowBlur=30;g.strokeStyle=acc;g.lineWidth=8/s;g.strokeText(S.zch,0,0);g.restore();
      if(e>0.8){g.globalAlpha=(e-0.8)/0.2;g.drawImage(B,0,0);}
      break;}
    case 'glitch':{ // 错位切片 + 色偏
      const base=e<0.5?A:B,other=e<0.5?B:A,amt=1-Math.abs(2*e-1),r=rnd(Math.floor(e*10)*7+Math.floor(S.s*100));
      g.drawImage(base,0,0);
      for(let k=0;k<14;k++){const y=r()*H,h=10+r()*90,dx=(r()-0.5)*420*amt;g.drawImage(r()<0.5?base:other,0,y,W,h,dx,y,W,h);}
      g.globalCompositeOperation='screen';g.globalAlpha=0.4*amt;
      for(let k=0;k<5;k++){g.fillStyle=k%2?C.cyan:C.mag;g.fillRect(0,r()*H,W,6+r()*30);}
      break;}
    case 'pixel':{ // 像素格溶解
      g.drawImage(A,0,0);
      for(const c of CELLS){
        if(e>c.th+0.12)g.drawImage(B,c.x,c.y,80,80,c.x,c.y,80,80);
        else if(e>c.th){g.fillStyle=acc;g.globalAlpha=0.6;g.fillRect(c.x,c.y,80,80);g.globalAlpha=1;}
      }
      break;}
    case 'flip':{ // 整屏翻转
      g.fillStyle='#000';g.fillRect(0,0,W,H);
      const img=e<0.5?A:B,sx=e<0.5?1-eIn(e*2):eOut((e-0.5)*2);
      g.translate(W/2,H/2);g.scale(Math.max(sx,0.001),1-0.08*(1-sx));g.drawImage(img,-W/2,-H/2);
      break;}
    case 'cut': default:{ // 卡拍硬切 + 霓虹闪光
      g.drawImage(B,0,0);
      g.globalCompositeOperation='screen';g.fillStyle=acc;g.globalAlpha=(1-clamp(e/0.6))*0.5;g.fillRect(0,0,W,H);
    }
  }
  g.restore();
}

/* ---------- HUD ---------- */
function hud(t,be){
  ctx.save();ctx.fillStyle='#fff';ctx.globalAlpha=0.5;ctx.textBaseline='middle';
  ctx.font=`900 22px ${FONT}`;ctx.textAlign='left';ctx.fillText('迷人的危险 — Dance Flow',40,34);
  ctx.textAlign='right';ctx.font=`700 20px ${MONO}`;ctx.fillText('BGM 01',W-200,34);
  for(let k=0;k<5;k++){ctx.globalAlpha=k===(be.i<0?-1:be.i%5)?0.8:0.2;ctx.fillRect(W-180+k*28,26,18,14);}
  ctx.globalAlpha=0.5;ctx.textAlign='left';ctx.fillText(fmt(t)+' / '+fmt(DUR),40,H-44);
  ctx.globalAlpha=0.16;ctx.fillRect(40,H-24,W-80,3);
  ctx.globalAlpha=0.7;ctx.fillRect(40,H-24,(W-80)*clamp(t/DUR),3);
  ctx.restore();
}

/* ---------- 总入口:画面只由时间 t 决定 ---------- */
function renderAt(t){
  t=clamp(t,0,DUR);
  let k=SC.length-1;while(k>0&&SC[k].s>t)k--;
  const S=SC[k];
  M.setTransform(1,0,0,1,0,0);M.globalAlpha=1;M.globalCompositeOperation='source-over';M.filter='none';
  if(k>0&&S.td&&t<S.s+S.td){
    const e=clamp((t-S.s)/S.td);
    withCtx(bufP,()=>SC[k-1].draw(t));
    withCtx(bufN,()=>S.draw(t));
    composite(S,e,bufP.canvas,bufN.canvas);
  }else withCtx(M,()=>S.draw(t));
  // 全片统一的胶片质感:颗粒 + 暗角
  M.save();M.globalCompositeOperation='overlay';M.globalAlpha=0.09;M.imageSmoothingEnabled=false;
  M.drawImage(GRAIN[Math.floor(t*24)%4],0,0,W,H);M.restore();
  M.drawImage(VIG,0,0);
  withCtx(M,()=>hud(t,beatInfo(t)));
}
window.renderAt=renderAt;window.DURATION=DUR;

/* ---------- 网页播放 ---------- */
const rec=/[?&]record/.test(location.search);
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(${-W*s/2}px,${-H*s/2}px) scale(${s})`;}
addEventListener('resize',fit);fit();
window.ready=document.fonts.load(`900 100px LJBlack`).then(()=>document.fonts.ready).then(()=>{renderAt(0);return true;});
if(rec){document.getElementById('cover').style.display='none';stage.style.transform='none';stage.style.left=stage.style.top='0';document.documentElement.style.overflow='hidden';}
else{
  const au=document.getElementById('au'),cover=document.getElementById('cover');
  let raf=0;
  const loop=()=>{renderAt(au.currentTime);raf=requestAnimationFrame(loop);};
  const play=()=>{cover.classList.add('hide');au.play();cancelAnimationFrame(raf);loop();};
  cover.addEventListener('click',play);
  au.addEventListener('ended',()=>{cover.classList.remove('hide');cancelAnimationFrame(raf);});
  addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();au.paused?play():au.pause();}});
  cv.addEventListener('click',e=>{
    const r=cv.getBoundingClientRect(),y=(e.clientY-r.top)/r.height*H,x=(e.clientX-r.left)/r.width*W;
    if(y>H-60){au.currentTime=clamp((x-40)/(W-80))*DUR;renderAt(au.currentTime);}
    else if(au.paused)play();else au.pause();
  });
}
})();
</script>
