<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>迷人的危险 · 歌词动画</title>
<style>
@font-face{font-family:'LJBlack';src:url(fonts/black.woff2) format('woff2');font-weight:900}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'LJBlack','PingFang SC','Microsoft YaHei',sans-serif}
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0}
canvas{width:1920px;height:1080px;display:block}
#cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  background:rgba(17,17,17,.82);color:#ecebe6;cursor:pointer;transition:opacity .3s}
#cover.hide{opacity:0;pointer-events:none}
#cover img{width:300px;height:300px;border-radius:12px}
#cover h1{margin:0;font-size:84px;letter-spacing:6px}
#cover p{margin:0;font-size:32px;opacity:.6}
#cover b{display:inline-block;margin-top:10px;padding:18px 56px;border-radius:12px;background:#d97757;color:#111;font-size:40px;font-weight:900}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="cover"><img src="cover.jpg" alt=""><h1>迷人的危险</h1><p>Dance Flow</p><b>▶ 点击播放</b></div>
</div>
<audio id="au" src="song.mp3" preload="auto"></audio>
<script src="data.js"></script>
<script>
(()=>{
const W=1920,H=1080,DUR=75.0; // 只用到 1:15
const cv=document.getElementById('c'),M=cv.getContext('2d');
let ctx=M; // 当前绘制目标;转场时会临时切到离屏画布
const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c.getContext('2d');};
const bufP=mk(),bufN=mk();
const FONT='"LJBlack","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif';
const MONO='"Consolas","WenQuanYi Zen Hei Mono","Courier New",monospace';
/* 配色:黑 / 米白 / 陶土橙 / 蓝,红色只给印章 */
const PALS={
  navy:{ink:'#0f1a2b',paper:'#f3efe6',orange:'#ff5b3a',blue:'#4d8dff',red:'#e8322b',gray:'#8b8f99',dark2:'#17243a',line:'#2c3b55'},
  rose:{ink:'#1d1a1c',paper:'#f4e9e6',orange:'#e8445a',blue:'#5b6cff',red:'#d6283c',gray:'#9a8f8f',dark2:'#2a2629',line:'#3d383b'},
  forest:{ink:'#10241c',paper:'#eeede4',orange:'#ff7a2f',blue:'#2e7d5b',red:'#e0362c',gray:'#8a8f86',dark2:'#183126',line:'#2a4537'},
  violet:{ink:'#1c1530',paper:'#ece8f3',orange:'#ff5f7e',blue:'#7a6bff',red:'#e2304a',gray:'#8e88a0',dark2:'#261d40',line:'#3a3057'},
  mono:{ink:'#111111',paper:'#f2f2f2',orange:'#ff3b30',blue:'#111111',red:'#ff3b30',gray:'#8a8a8a',dark2:'#1c1c1c',line:'#3a3a3a'},
  milktea:{ink:'#2b211c',paper:'#efe4d6',orange:'#c8553d',blue:'#2f6f73',red:'#b8322a',gray:'#9a8b7e',dark2:'#3a2d26',line:'#4d3e35'},
};
const C=PALS[(location.search.match(/pal=(\w+)/)||[])[1]]||PALS.milktea;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eOut=t=>1-Math.pow(1-t,3);
const eIn=t=>t*t*t;
const eIO=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eBack=t=>{const c=1.9,x=t-1;return 1+(c+1)*x*x*x+c*x*x;};
const rnd=seed=>{let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};};
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};

/* ---------- 节拍 ---------- */
function beatInfo(t){
  const B=BEATS;
  if(t<B[0])return{i:-1,ph:1,pulse:0};
  let lo=0,hi=B.length-1;
  while(lo<hi){const m=(lo+hi+1)>>1;if(B[m]<=t)lo=m;else hi=m-1;}
  const iv=(B[lo+1]||B[lo]+0.44)-B[lo];
  const ph=clamp((t-B[lo])/iv);
  return{i:lo,ph,pulse:Math.exp(-ph*5)};
}

/* ---------- 每句的场景:用界面道具讲故事 ---------- */
const SPEC=[
 ['type','ink','l',{enter:'side',deco:'marker',dec:['grid','shapes','arrow'],note:'眼泪 ×1'}],
 ['toggle','paper',{enter:'drop',dec:['shapes','ticker']}],
 ['dialog','ink',{title:'warning.exe',btn:['确定','取消'],click:0,enter:'scale',dec:['grid','popups','burst']}],
 ['stamp','paper',{word:'不配',enter:'wipe',dec:['blocks','shapes','burst']}],
 ['type','paper','z',{enter:'flip',deco:'circle',dec:['blocks','shapes','arrow'],note:'看不见?'}],
 ['split','paper','c',{enter:'scale',dec:['tape','shapes','burst']}],
 ['type','ink','c',{crack:1,enter:'drop',dec:['tape','grid','burst']}],
 ['stamp','ink',{word:'痛',enter:'wipe',dec:['shapes','burst','ticker']}],
 ['type','paper','l',{enter:'side',deco:'underline',dec:['blocks','shapes','arrow'],note:'好锋利'}],
 ['progress','paper',{enter:'flip',deco:'marker',dec:['grid','shapes','burst']}],
 ['overflow','ink',{dec:['tape','shapes'],tape:'OVERFLOW · 溢出 · '}],
 ['term','ink',{enter:'scale',dec:['grid','popups','burst']}],
 ['type','paper','z'],['stamp','ink',{word:'抱歉'}],['split','paper','l'],['chat','paper'],['type','ink','c'],['type','paper','l'],
 ['split','paper','c'],['type','ink','c',{crack:1}],['stamp','paper',{word:'痛'}],['type','ink','z'],
 ['notify','ink'],['type','paper','l'],['term','ink'],
 ['check','paper'],['check','ink'],['check','paper'],['check','ink'],['check','paper'],['check','ink'],['check','paper'],
 ['dialog','paper',{title:'抉择.exe',msg:'要继续偷偷喜欢吗？',btn:['Yes','No'],hesitate:1}],['progress','ink',{weight:1}],
 ['split','paper','c'],['type','ink','c',{crack:1}],['stamp','paper',{word:'痛'}],['type','paper','z'],
 ['notify','ink'],['type','paper','l'],['term','ink'],['final','ink']];
const TR=['wipe','slide','zoom','cut','wipe', 'bars','cut','cut','slide', 'wipe','zoom','cut',
 'slide','cut','bars','wipe','slide','zoom', 'bars','cut','cut','slide', 'zoom','wipe','cut',
 'bars','cut','cut','cut','cut','cut','cut', 'zoom','wipe', 'bars','cut','cut','slide', 'zoom','wipe','cut','bars'];
const TD={wipe:.5,slide:.4,zoom:.4,bars:.55,cut:.12};
const KEY=['危险','残缺','痛','滚远','淹灭','死结','欺骗','抱歉','泪水','绝望','孤单','暗恋','特别','迷人','沉重','不配','抉择','伤悲'];

function splitRows(s){
  const out=[];
  for(const ph of s.split(/\s+/).filter(Boolean)){
    const ch=[...ph];
    if(ch.length>7){
      const k=Math.ceil(ch.length/6),cuts=[];let prev=0;
      for(let r=1;r<k;r++){
        const ideal=Math.round(ch.length*r/k);let best=ideal,bs=-9;
        for(let p=Math.max(prev+2,ideal-2);p<=Math.min(ch.length-2,ideal+2);p++){
          let sc=-Math.abs(p-ideal);
          if('的了着地得里'.includes(ch[p-1]))sc+=3;
          if(ch.slice(p-3,p).join('')==='为什么')sc+=3;
          if('的了着地得'.includes(ch[p]))sc-=3;
          if(sc>bs){bs=sc;best=p;}
        }
        cuts.push(best);prev=best;
      }
      let a=0;for(const c of [...cuts,ch.length]){out.push(ch.slice(a,c).join(''));a=c;}
    }else out.push(ph);
  }
  return out;
}

/* ---------- 预处理:每个字的演唱时间 ---------- */
const LYR=LYRICS.filter(l=>l.t<DUR-2);
const LN=LYR.map((ly,i)=>{
  const [tpl,bg,lay='l',opt={}]=SPEC[i]||['type','ink','c'];
  const o=typeof lay==='object'?lay:opt,mode=typeof lay==='string'?lay:'l';
  const flat=ly.s.replace(/\s/g,''),nch=flat.length;
  const em=new Array(nch).fill(false);let hero=null;
  for(const k of KEY){let p=-1;while((p=flat.indexOf(k,p+1))>=0){for(let j=0;j<k.length;j++)em[p+j]=true;if(!hero||k.length>hero.w.length)hero={w:k,g:p};}}
  const nextT=LYR[i+1]?LYR[i+1].t:DUR;
  const t1=nextT-ly.t<=7.6?nextT:ly.t+6.4;
  const pause=[];{let g=0,sp=false;for(const c of ly.s){if(/\s/.test(c)){sp=g>0;continue;}pause[g++]=sp;sp=false;}}
  const u=[];{let a=0;for(let g=0;g<nch;g++){if(pause[g])a+=1.2;u[g]=a;a+=1;}}
  const U=u[nch-1]+1,sing=clamp(Math.min(t1-ly.t-0.45,U*0.34),0.4,99);
  let g=0;
  const rows=splitRows(ly.s).map(r=>[...r].map(c=>{const o2={c,g,tr:sing*u[g]/U,cd:sing/U,emph:em[g]};g++;return o2;}));
  const word=o.word||'';const wi=word?flat.indexOf(word):-1;
  return{i,t0:ly.t,t1,dur:t1-ly.t,tpl,bg,mode,o,flat,rows,R:rows.length,maxN:Math.max(...rows.map(r=>r.length)),hero,
    heroT:hero?rows.flat()[hero.g].tr:0,heroEnd:hero?rows.flat()[hero.g+hero.w.length-1].tr+sing/U:0,
    wordT:wi>=0?sing*u[wi]/U:0.3,singEnd:sing,
    rowT:rows.map(r=>r[0].tr),acc:i%3===2?C.blue:C.orange};
});
const LAST_END=LN[LN.length-1].t1;

/* ---------- 排版工具 ---------- */
const fit=(L,maxW,maxH,cap,lhK=1.18)=>Math.min(cap,maxW/(L.maxN*0.98),maxH/(L.R*lhK));
function rowsLayout(L,size,mode,cx,cy,x0=150,x1=W-150,lhK=1.18){
  const adv=size*0.98,lh=size*lhK,R=L.R;
  return L.rows.map((r,k)=>{const rw=r.length*adv;let x;
    if(mode==='c'||(mode==='z'&&R===1))x=cx-rw/2;else if(mode==='z')x=k%2?x1-rw:x0;else if(mode==='r')x=x1-rw;else x=x0;
    return{x,y:cy-R*lh/2+lh*(k+0.5),adv,lh,rw};});
}
/* 歌词:每个词组唱到时整块进场(6 种进场方式);关键词唱到时强调(4 种强调方式) */
function drawRows(L,lt,lay,size,face,acc,ext,opt={}){
  const enter=L.o.enter||'slide',deco=L.o.deco||'3d';
  ctx.save();ctx.font=`900 ${size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  L.rows.forEach((row,k)=>{
    const P=lay[k],tk=L.rowT[k]-0.06;if(lt<tk)return;
    const dur=enter==='wipe'?0.45:0.32,p=clamp((lt-tk)/dur),rcx=P.x+P.rw/2;
    // 关键词连续段
    const runs=[];row.forEach((ch,j)=>{if(!ch.emph)return;const r=runs[runs.length-1];if(r&&r[1]===j-1)r[1]=j;else runs.push([j,j]);});
    ctx.save();
    let bar=null;
    if(enter==='slide'){if(p<1){ctx.beginPath();ctx.rect(P.x-size*0.3,P.y-P.lh*0.62,P.rw+size*0.6,P.lh*1.24);ctx.clip();}ctx.translate(0,(1-eOut(p))*P.lh*0.9);}
    else if(enter==='drop'){ctx.globalAlpha=clamp(p*4);ctx.translate(0,-(1-eBack(p))*260);}
    else if(enter==='scale'){const s=lerp(1.9,1,eOut(p));ctx.globalAlpha=clamp(p*3);ctx.translate(rcx,P.y);ctx.scale(s,s);ctx.translate(-rcx,-P.y);}
    else if(enter==='side'){ctx.globalAlpha=clamp(p*3);ctx.translate((k%2?1:-1)*(1-eOut(p))*700,0);}
    else if(enter==='flip'){ctx.translate(0,P.y);ctx.scale(1,Math.max(0.001,eBack(p)));ctx.translate(0,-P.y);}
    else if(enter==='wipe'){ // 色条先盖住,再收走露出字
      const x0=P.x-size*0.25,w=P.rw+size*0.5,a=eIO(clamp(p/0.5)),b=eIO(clamp((p-0.5)/0.5));
      bar=[x0+w*b,P.y-P.lh*0.46,w*(a-b),P.lh*0.92];
      if(p<0.5){ctx.fillStyle=acc;ctx.fillRect(...bar);ctx.restore();return;}
      if(p<1){ctx.beginPath();ctx.rect(x0,P.y-P.lh,w*b,P.lh*2);ctx.clip();}
    }
    // 马克笔高亮块(画在字后面)
    if(deco==='marker')for(const[j0,j1]of runs){const ea=eOut(clamp((lt-row[j0].tr)/0.22));if(ea<=0)continue;
      ctx.fillStyle=acc;ctx.fillRect(P.x+P.adv*j0-size*0.08,P.y-size*0.56,((j1-j0+1)*P.adv+size*0.16)*ea,size*1.12);}
    row.forEach((ch,j)=>{
      const x=P.x+P.adv*(j+0.5),y=P.y;
      const on=ch.emph&&lt>=ch.tr,ea=clamp((lt-ch.tr)/0.18);
      const crack=L.o.crack&&on&&L.hero&&ch.g>=L.hero.g&&ch.g<L.hero.g+L.hero.w.length?eOut(clamp((lt-L.heroEnd)/0.25)):0;
      const draw=(dx)=>{
        if(on&&deco==='3d'){const d=Math.max(5,size*0.07)*eOut(ea);ctx.fillStyle=ext;for(let s=Math.ceil(d);s>=1;s--)ctx.fillText(ch.c,x+dx+s,y+s);ctx.fillStyle=acc;}
        else if(on&&deco==='marker')ctx.fillStyle='#fff';
        else if(on)ctx.fillStyle=acc;
        else ctx.fillStyle=face;
        ctx.fillText(ch.c,x+dx,y);
      };
      if(crack>0){
        for(const[sgn,top]of[[-1,true],[1,false]]){
          ctx.save();ctx.beginPath();ctx.rect(x-size,top?y-size:y+size*0.04,size*2,size*0.96);ctx.clip();draw(sgn*crack*size*0.09);ctx.restore();
        }
      }else draw(0);
    });
    // 下划线 / 手绘圈(画在字上面)
    for(const[j0,j1]of runs)if(L.hero&&row[j0].g<=L.hero.g&&row[j1].g>=L.hero.g)L._hp={x:P.x+P.adv*(j0+j1+1)/2,y:P.y,r:size*0.6*(j1-j0+1)};
    L._by1=Math.max(L._by1||0,P.y+P.lh/2);L._by0=Math.min(L._by0||H,P.y-P.lh/2);
    for(const[j0,j1]of runs){
      const ea=eOut(clamp((lt-row[j0].tr)/0.3));if(ea<=0)continue;
      const x0=P.x+P.adv*j0,len=(j1-j0+1)*P.adv;
      ctx.strokeStyle=acc;ctx.lineCap='round';
      if(deco==='underline'){ctx.lineWidth=size*0.09;ctx.beginPath();ctx.moveTo(x0,P.y+size*0.62);ctx.lineTo(x0+len*ea,P.y+size*0.62);ctx.stroke();}
      if(deco==='circle'){ctx.lineWidth=size*0.055;ctx.beginPath();
        const cx=x0+len/2,rx=len/2+size*0.4,ry=size*0.78,a0=-2.4;
        for(let q=0;q<=60*ea;q++){const a=a0+q/60*6.283*1.12,wob=1+0.04*Math.sin(q*0.7);ctx.lineTo(cx+Math.cos(a)*rx*wob,P.y+Math.sin(a)*ry*wob-0.06*Math.cos(a)*rx);}
        ctx.stroke();}
    }
    ctx.restore();
    if(bar&&p<1){ctx.fillStyle=acc;ctx.fillRect(...bar);}
  });
  ctx.restore();
}
function bgFill(bg){ctx.fillStyle=bg==='ink'?C.ink:C.paper;ctx.fillRect(0,0,W,H);if(CUR){const c=CUR;CUR=null;decorBack(c.L,c.lt,c.t,c.be);}}
const FG=bg=>bg==='ink'?C.paper:C.ink;
function dots(x0,y0,cols,rows,sp,col,r=3){ctx.fillStyle=col;for(let a=0;a<cols;a++)for(let b=0;b<rows;b++){ctx.beginPath();ctx.arc(x0+a*sp,y0+b*sp,r,0,6.283);ctx.fill();}}
function cursor(x,y,press=0){
  const A=['#.........','##........','#W#.......','#WW#......','#WWW#.....','#WWWW#....','#WWWWW#...','#WWWWWW#..','#WWW####..','#W#W#.....','##.#W#....','.....#W#..','......##..'];
  const s=6*(1-0.12*press);
  for(let r=0;r<A.length;r++)for(let c=0;c<10;c++){const v=A[r][c];if(v==='.')continue;ctx.fillStyle=v==='W'?'#fff':'#111';ctx.fillRect(x+c*s,y+r*s,s,s);}
}
function windowBox(x,y,w,h,title,dark){
  ctx.fillStyle=dark?C.dark2:'#f7f6f2';ctx.strokeStyle=dark?C.line:C.ink;ctx.lineWidth=dark?3:6;
  ctx.beginPath();ctx.roundRect(x,y,w,h,14);ctx.fill();ctx.stroke();
  ctx.fillStyle=dark?'#262626':C.ink;ctx.beginPath();ctx.roundRect(x,y,w,64,[14,14,0,0]);ctx.fill();
  ['#ff5f57','#febc2e','#28c840'].forEach((c,k)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x+34+k*30,y+32,9,0,6.283);ctx.fill();});
  ctx.fillStyle='#cfcdc7';ctx.font=`24px ${MONO}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(title,x+w/2,y+32);
}
function button(x,y,w,h,label,state,acc){ // state 0 普通 1 悬停 2 按下
  ctx.save();const d=state===2?0:8;
  ctx.fillStyle=C.ink;ctx.beginPath();ctx.roundRect(x+8,y+8,w,h,10);ctx.fill();
  ctx.fillStyle=state?acc:'#fff';ctx.strokeStyle=C.ink;ctx.lineWidth=5;
  ctx.beginPath();ctx.roundRect(x+8-d,y+8-d,w,h,10);ctx.fill();ctx.stroke();
  ctx.fillStyle=state?'#fff':C.ink;ctx.font=`900 46px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x+8-d+w/2,y+8-d+h/2+2);
  ctx.restore();
}

/* ---------- 装饰动画层 ---------- */
let CUR=null; // 当前正在画的句子,bgFill 之后顺手画背景装饰
const has=(L,d)=>(L.o.dec||[]).includes(d);
function shapeAt(type,x,y,sz,col,rot,lw){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.lineCap='round';
  switch(type){
    case 0:ctx.beginPath();ctx.arc(0,0,sz/2,0,6.283);ctx.fill();break;
    case 1:ctx.beginPath();ctx.arc(0,0,sz/2,0,6.283);ctx.stroke();break;
    case 2:ctx.fillRect(-sz/2,-sz/2,sz,sz);break;
    case 3:ctx.beginPath();ctx.moveTo(0,-sz/2);ctx.lineTo(sz/2,sz/2);ctx.lineTo(-sz/2,sz/2);ctx.closePath();ctx.stroke();break;
    case 4:ctx.fillRect(-sz/2,-sz/7,sz,sz*2/7);ctx.fillRect(-sz/7,-sz/2,sz*2/7,sz);break;
    case 5:ctx.beginPath();for(let k=0;k<=6;k++)ctx.lineTo(-sz/2+k*sz/6,k%2?-sz/5:sz/5);ctx.stroke();break;
  }
  ctx.restore();
}
const ANCH=[[170,190],[W-210,170],[W-150,H/2+40],[200,H-210],[W-330,H-190],[W/2+460,120],[110,H/2-30],[W/2-420,H-130]];
function decorBack(L,lt,t,be){
  const dark=L.bg==='ink'||['term','notify','overflow','final'].includes(L.tpl);
  const ink=dark?'rgba(239,228,214,':'rgba(43,33,28,';
  if(has(L,'grid')){ // 缓慢平移的点阵
    const off=(t*22)%40;ctx.fillStyle=ink+'.10)';
    for(let x=-40+off;x<W+40;x+=40)for(let y=-40+off*0.6;y<H+40;y+=40){ctx.fillRect(x,y,4,4);}
  }
  if(has(L,'blocks')){ // 两块大色块带视差滑入
    const p=eOut(clamp(lt/0.5));
    ctx.fillStyle=C.blue;ctx.globalAlpha=0.9;ctx.fillRect(lerp(-700,-120,p)-lt*10,H-330,620,420);
    ctx.fillStyle=C.orange;ctx.beginPath();ctx.arc(lerp(W+400,W-120,p)+lt*8,150,260,0,6.283);ctx.fill();ctx.globalAlpha=1;
  }
  if(has(L,'tape')){ // 斜贴的警示胶带
    const txt=L.o.tape||'DANGER · 危险 · ';
    [[-0.2,H*0.22,1,C.orange],[0.16,H*0.8,-1,dark?C.paper:C.ink]].forEach(([rot,y,dir,bgc],k)=>{
      const p=eOut(clamp((lt-k*0.08)/0.4));
      ctx.save();ctx.translate(W/2+(1-p)*dir*W*1.2,y);ctx.rotate(rot);
      ctx.fillStyle=bgc;ctx.fillRect(-W,-46,W*2,92);
      ctx.fillStyle=bgc===C.orange?C.ink:(dark?C.ink:C.paper);ctx.font=`900 52px ${FONT}`;ctx.textBaseline='middle';ctx.textAlign='left';
      const w=ctx.measureText(txt).width;for(let x=-W-((t*140*dir)%w+w)%w;x<W;x+=w)ctx.fillText(txt,x,3);
      ctx.restore();
    });
  }

  },
  check(L,lt,t,be){ // 待办清单:唱到一个词勾一个
    bgFill(L.bg);const fg=FG(L.bg),size=Math.min(150,fit(L,1300,640,150,1.5)),acc=L.i%2?C.blue:C.orange;
    ctx.font=`700 32px ${MONO}`;ctx.fillStyle=L.bg==='ink'?'rgba(236,235,230,.6)':'rgba(17,17,17,.6)';ctx.textAlign='left';ctx.textBaseline='alphabetic';
    ctx.fillText('TODO · 今天的心情  ('+(L.i-24)+'/7)',160,150);
    const lay=rowsLayout(L,size,'l',W/2,H/2+30,400,W-150,1.5);
    L.rows.forEach((r,k)=>{
      const tt=L.rowT[k];if(lt<tt-0.06)return;const P=lay[k],bs=size*0.8,bx=200,by=P.y-bs/2;
      ctx.strokeStyle=fg;ctx.lineWidth=8;ctx.strokeRect(bx,by,bs,bs);
      const cp=clamp((lt-tt-0.1)/0.2);
      if(cp>0){ctx.strokeStyle=acc;ctx.lineWidth=18;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
        const a=[bx+bs*0.18,by+bs*0.52],b=[bx+bs*0.42,by+bs*0.78],c=[bx+bs*0.95,by+bs*0.05];
        ctx.moveTo(...a);if(cp<0.4){const q=cp/0.4;ctx.lineTo(lerp(a[0],b[0],q),lerp(a[1],b[1],q));}else{const q=(cp-0.4)/0.6;ctx.lineTo(...b);ctx.lineTo(lerp(b[0],c[0],q),lerp(b[1],c[1],q));}ctx.stroke();}
    });
    drawRows(L,lt,lay,size,fg,acc,L.bg==='ink'?'#000':C.ink);
  },
};
function drawLine(L,t){
  const be=beatInfo(t),lt=t-L.t0;
  // 镜头只有极轻的平滑推进
  const z=1.03-0.03*eOut(clamp(lt/L.dur));
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2,-H/2);
  L._hp=null;L._by0=H;L._by1=0;CUR={L,lt:Math.max(lt,0),t,be};
  if(lt<0){bgFill(L.bg==='ink'?'ink':'paper');}
  TPL[L.tpl](L,Math.max(lt,-1),t,be);CUR=null;
  if(lt>=0)decorFront(L,lt,t,be);
  ctx.restore();
  return L.bg==='ink'||L.tpl==='term'||L.tpl==='notify'||L.tpl==='overflow'||L.tpl==='final'?C.paper:C.ink;
}

/* ---------- 前奏 / 间奏 / 尾声 ---------- */
function introTerm(t){
  ctx.fillStyle='#0c0c0c';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1b1b1b';ctx.fillRect(0,0,W,56);
  ctx.fillStyle='#0c0c0c';ctx.beginPath();ctx.roundRect(520,12,240,44,10);ctx.fill();
  ctx.fillStyle=C.orange;ctx.fillRect(536,27,14,14);
  ctx.font=`900 22px ${FONT}`;ctx.fillStyle='#ddd';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('Lin · play',562,34);
  const prompt='PS D:\\Lin> ',cmd='play 迷人的危险.flac';
  ctx.font=`34px ${MONO}`;ctx.textBaseline='alphabetic';
  ctx.fillStyle='#8a8883';ctx.fillText(prompt,50,140);
  const pw=ctx.measureText(prompt).width,typed=Math.floor(clamp((t-0.6)/1.5)*cmd.length),sh=cmd.slice(0,typed);
  ctx.fillStyle=C.orange;ctx.fillText(sh,50+pw,140);
  if(t<2.3&&Math.floor(t*2.5)%2===0){ctx.fillStyle=C.orange;ctx.fillRect(50+pw+ctx.measureText(sh).width+4,108,18,38);}
  ctx.font=`30px ${MONO}`;
  if(t>2.2){ctx.fillStyle='#d8d6d0';ctx.fillText('♪ Dance Flow — 迷人的危险',50,210);}
  if(t>2.23){ctx.fillStyle='#8a8883';ctx.fillText(CREDITS[1],50,260);}
  if(t>3.48){ctx.fillStyle='#8a8883';ctx.fillText(CREDITS[2],50,310);}
  if(t>2.8){ctx.fillStyle=C.orange;ctx.fillText('[loading] '+'█'.repeat(Math.floor(clamp((t-2.8)/0.9)*24)),50,360);}
  return C.paper;
}
function introTitle(t){ // 原创开场:音乐播放器卡片,光标点下播放
  const be=beatInfo(t),lt=t-3.8;
  ctx.fillStyle=C.ink;ctx.fillRect(0,0,W,H);
  dots(80,120,6,30,34,'rgba(239,228,214,.10)');dots(W-260,120,6,30,34,'rgba(239,228,214,.10)');
  const p=eOut(clamp(lt/0.55)),x=250,y=lerp(H+40,210,p),w=1420,h=620;
  ctx.fillStyle='#000';ctx.beginPath();ctx.roundRect(x+18,y+18,w,h,30);ctx.fill();
  ctx.fillStyle=C.paper;ctx.beginPath();ctx.roundRect(x,y,w,h,30);ctx.fill();
  // 封面:旋转的黑胶唱片
  const vx=x+310,vy=y+310,spin=lt>1.25?(lt-1.25)*2.2:0;
  ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(vx,vy,240,0,6.283);ctx.fill();
  ctx.strokeStyle='rgba(239,228,214,.10)';ctx.lineWidth=2;for(let r=90;r<235;r+=14){ctx.beginPath();ctx.arc(vx,vy,r,0,6.283);ctx.stroke();}
  ctx.save();ctx.translate(vx,vy);ctx.rotate(spin);ctx.strokeStyle='rgba(239,228,214,.35)';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,200,-0.5,0.3);ctx.stroke();ctx.beginPath();ctx.arc(0,0,160,2.6,3.3);ctx.stroke();
  ctx.fillStyle=C.orange;ctx.beginPath();ctx.arc(0,0,80,0,6.283);ctx.fill();ctx.fillStyle=C.paper;ctx.fillRect(-4,-60,8,30);ctx.restore();
  ctx.fillStyle=C.paper;ctx.beginPath();ctx.arc(vx,vy,12,0,6.283);ctx.fill();
  // 标题
  const tx=x+630;ctx.font=`900 120px ${FONT}`;ctx.textBaseline='middle';
  ctx.fillStyle=C.ink;ctx.textAlign='left';ctx.fillText('迷人的危险',tx,y+150);
  ctx.fillStyle=C.gray;ctx.font=`900 44px ${FONT}`;ctx.fillText('Dance Flow',tx,y+240);
  // 进度条
  const by=y+330,bw=w-630-80;
  ctx.fillStyle='rgba(43,33,28,.18)';ctx.fillRect(tx,by,bw,10);ctx.fillStyle=C.orange;ctx.fillRect(tx,by,bw*clamp(t/DUR),10);
  ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(tx+bw*clamp(t/DUR),by+5,14,0,6.283);ctx.fill();
  ctx.font=`700 26px ${MONO}`;ctx.fillStyle=C.gray;ctx.fillText(fmt(t),tx,by+48);ctx.textAlign='right';ctx.fillText(fmt(DUR),tx+bw,by+48);
  // 播放控制
  const cy=y+455,pc=tx+bw/2,playing=lt>1.25,press=lt>1.1&&lt<1.3;
  ctx.fillStyle=C.ink;
  for(const s of[-1,1]){const bx=pc+s*170;ctx.beginPath();ctx.moveTo(bx-s*12,cy-24);ctx.lineTo(bx-s*12,cy+24);ctx.lineTo(bx+s*22,cy);ctx.closePath();ctx.fill();ctx.fillRect(bx+(s>0?24:-30),cy-24,6,48);}
  const pr=press?52:58;ctx.fillStyle=C.orange;ctx.beginPath();ctx.arc(pc,cy,pr,0,6.283);ctx.fill();
  ctx.fillStyle=C.paper;
  if(playing){ctx.fillRect(pc-20,cy-24,13,48);ctx.fillRect(pc+7,cy-24,13,48);}
  else{ctx.beginPath();ctx.moveTo(pc-14,cy-26);ctx.lineTo(pc-14,cy+26);ctx.lineTo(pc+26,cy);ctx.closePath();ctx.fill();}
  // 波形
  const n=44,ww=bw/n;for(let k=0;k<n;k++){const v=playing?(0.3+0.7*(0.5+0.5*Math.sin(t*3+k*0.7)))*(0.35+0.65*be.pulse):0.08;
    ctx.fillStyle=k/n<t/DUR?C.orange:'rgba(43,33,28,.35)';ctx.fillRect(tx+k*ww,y+560-v*50,ww*0.55,v*50);}
  // 光标点播放
  if(lt<2){const cp=eOut(clamp((lt-0.4)/0.7));cursor(lerp(W+60,pc,cp),lerp(H+60,cy,cp),press?1:0);}
  return C.paper;
}
function interlude(t){
  const be=beatInfo(t);
  ctx.fillStyle=C.orange;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.font=`900 300px ${FONT}`;ctx.textBaseline='middle';ctx.textAlign='left';
  const unit='DANCE FLOW · ',w=ctx.measureText(unit).width;
  for(let r=0;r<3;r++){ctx.fillStyle=r===1?C.ink:'rgba(17,17,17,.14)';const dir=r%2?-1:1;for(let x=((t*160*dir)%w+w)%w-w;x<W;x+=w)ctx.fillText(unit,x,H/2+(r-1)*320);}
  ctx.restore();
  const n=32,bw=W/n;for(let k=0;k<n;k++){const v=(0.5+0.5*Math.sin(t*2.6+k*0.8))*(0.3+0.7*be.pulse);ctx.fillStyle=C.ink;ctx.fillRect(k*bw+8,H-v*200,bw-16,v*200);}
  return C.ink;
}
function outro(t){
  const lt=t-LAST_END,be=beatInfo(t);
  ctx.fillStyle=C.paper;ctx.fillRect(0,0,W,H);
  const r=rnd(77),cols=[C.orange,C.blue,C.ink,C.red];
  ANCH.forEach(([ax,ay],k)=>{const p=eBack(clamp((lt-k*0.06)/0.35));if(p<=0)return;
    shapeAt(Math.floor(r()*6),ax,ay+Math.sin(t+k)*12,(50+r()*70)*p*(1+0.14*be.pulse),cols[k%4],t*0.5+k,9);});
  ctx.textAlign='center';ctx.textBaseline='middle';
  const p=eOut(clamp((lt-0.15)/0.45));
  ctx.save();ctx.beginPath();ctx.rect(0,H/2-230,W,330);ctx.clip();ctx.translate(0,(1-p)*320);
  ctx.font=`900 200px ${FONT}`;ctx.fillStyle=C.ink;for(let d=12;d>=1;d--)ctx.fillText('迷人的危险',W/2+d,H/2-60+d);ctx.fillStyle=C.orange;ctx.fillText('迷人的危险',W/2,H/2-60);ctx.restore();
  ctx.globalAlpha=clamp((lt-0.7)/0.4);ctx.fillStyle=C.ink;ctx.font=`900 54px ${FONT}`;ctx.fillText('Dance Flow',W/2,H/2+130);ctx.globalAlpha=1;
  ctx.fillStyle=C.ink;ctx.fillRect(W/2-150,H/2+70,300*eOut(clamp((lt-0.5)/0.5)),10);
  return C.ink;
}

/* ---------- 场景时间线 ---------- */
const SC=[{s:0,draw:introTerm},{s:3.8,trans:'cut',td:0.12,draw:introTitle}];
LN.forEach((L,i)=>{
  if(i>0&&LN[i-1].t1<L.t0-0.01)SC.push({s:LN[i-1].t1,trans:'wipe',td:TD.wipe,draw:interlude,col:C.ink});
  const tr=TR[i]||'cut',td=TD[tr],lead=tr==='cut'?0:td*0.6;
  SC.push({s:L.t0-lead,trans:tr,td,dir:i%2?-1:1,col:[C.orange,C.blue,C.ink][i%3],draw:t=>drawLine(L,t)});
});
SC.push({s:LAST_END,trans:'bars',td:0.55,col:C.ink,draw:outro});

/* ---------- 转场合成 ---------- */
function withCtx(c,fn){const o=ctx;ctx=c;c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';const r=fn();ctx=o;return r;}
function composite(S,e,A,B){
  const g=M;g.save();
  switch(S.trans){
    case 'wipe':{ // 一块纯色推过去再揭开
      const d=S.dir||1,a=eIO(clamp(e/0.5)),b=eIO(clamp((e-0.5)/0.5));
      g.drawImage(e<0.5?A:B,0,0);g.fillStyle=S.col;
      if(d>0)g.fillRect(W*b,0,W*(a-b),H);else g.fillRect(W*(1-a),0,W*(a-b),H);
      break;}
    case 'slide':{ // 整屏推走
      const s=eIO(e),d=S.dir||1;g.drawImage(A,-d*W*s,0);g.drawImage(B,d*W*(1-s),0);
      g.fillStyle=S.col;g.fillRect(d>0?W*(1-s)-16:W*s-W,0,d>0?16:16,H);
      break;}
    case 'zoom':{ // 新画面从一个方框里放大出来
      g.drawImage(A,0,0);const s=eIO(e),w=lerp(240,W,s),h=lerp(135,H,s);
      g.fillStyle=C.ink;g.fillRect(W/2-w/2+12*(1-s),H/2-h/2+12*(1-s),w,h);
      g.save();g.beginPath();g.rect(W/2-w/2,H/2-h/2,w,h);g.clip();g.translate(W/2,H/2);g.scale(lerp(0.5,1,s),lerp(0.5,1,s));g.drawImage(B,-W/2,-H/2);g.restore();
      g.strokeStyle=C.ink;g.lineWidth=6*(1-s);if(s<1)g.strokeRect(W/2-w/2,H/2-h/2,w,h);
      break;}
    case 'bars':{ // 三色块斜推
      g.drawImage(A,0,0);const sk=360,cols=[C.blue,C.orange,C.ink,null];
      cols.forEach((col,k)=>{
        const x=(W+sk)*eOut(clamp((e-k*0.09)/0.62));if(x<=0)return;
        g.save();g.beginPath();g.moveTo(-sk,0);g.lineTo(x,0);g.lineTo(x-sk,H);g.lineTo(-sk,H);g.closePath();
        if(col){g.fillStyle=col;g.fill();}else{g.clip();g.drawImage(B,0,0);}
        g.restore();
      });
      break;}
    case 'cut': default:g.drawImage(B,0,0);
  }
  g.restore();
}

/* ---------- HUD ---------- */
function hud(t,ink,be){
  ctx.save();ctx.fillStyle=ink;ctx.globalAlpha=0.6;ctx.textBaseline='middle';
  for(let k=0;k<3;k++){const v=0.35+0.65*Math.abs(Math.sin(t*3+k*1.7))*(0.4+0.6*be.pulse);ctx.fillRect(40+k*9,44-v*22,5,v*22);}
  ctx.font=`900 22px ${FONT}`;ctx.textAlign='left';ctx.fillText('迷人的危险 — Dance Flow',78,34);
  ctx.font=`700 20px ${MONO}`;ctx.fillText(fmt(t)+' / '+fmt(DUR),40,H-44);
  ctx.globalAlpha=0.18;ctx.fillRect(40,H-24,W-80,4);
  ctx.globalAlpha=0.85;ctx.fillRect(40,H-24,(W-80)*clamp(t/DUR),4);
  ctx.restore();
}

/* ---------- 总入口:画面只由时间 t 决定 ---------- */
function renderAt(t){
  t=clamp(t,0,DUR);
  let k=SC.length-1;while(k>0&&SC[k].s>t)k--;
  const S=SC[k];
  M.setTransform(1,0,0,1,0,0);M.globalAlpha=1;M.globalCompositeOperation='source-over';
  let ink;
  if(k>0&&S.td&&t<S.s+S.td){
    const e=clamp((t-S.s)/S.td);
    withCtx(bufP,()=>SC[k-1].draw(t));
    ink=withCtx(bufN,()=>S.draw(t));
    composite(S,e,bufP.canvas,bufN.canvas);
  }else ink=withCtx(M,()=>S.draw(t));
  withCtx(M,()=>hud(t,ink,beatInfo(t)));
  if(t>DUR-1.6){M.fillStyle=`rgba(0,0,0,${clamp((t-DUR+1.6)/1.6)})`;M.fillRect(0,0,W,H);}
}
window.renderAt=renderAt;window.DURATION=DUR;

/* ---------- 网页播放 ---------- */
const rec=/[?&]record/.test(location.search);
const stage=document.getElementById('stage');
function fitStage(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(${-W*s/2}px,${-H*s/2}px) scale(${s})`;}
addEventListener('resize',fitStage);fitStage();
window.ready=document.fonts.load(`900 100px LJBlack`).then(()=>document.fonts.ready).then(()=>{renderAt(0);return true;});
if(rec){document.getElementById('cover').style.display='none';stage.style.transform='none';stage.style.left=stage.style.top='0';document.documentElement.style.overflow='hidden';}
else{
  const au=document.getElementById('au'),cover=document.getElementById('cover');
  let raf=0;
  const loop=()=>{const t=au.currentTime;au.volume=clamp((DUR-t)/2);if(t>=DUR){au.pause();au.currentTime=0;au.volume=1;cover.classList.remove('hide');renderAt(DUR);return;}renderAt(t);raf=requestAnimationFrame(loop);};
  const play=()=>{cover.classList.add('hide');au.play();cancelAnimationFrame(raf);loop();};
  cover.addEventListener('click',play);
  au.addEventListener('ended',()=>{cover.classList.remove('hide');cancelAnimationFrame(raf);});
  addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();au.paused?play():au.pause();}});
  cv.addEventListener('click',e=>{
    const r=cv.getBoundingClientRect(),y=(e.clientY-r.top)/r.height*H,x=(e.clientX-r.left)/r.width*W;
    if(y>H-60){au.currentTime=clamp((x-40)/(W-80))*DUR;renderAt(au.currentTime);}
    else if(au.paused)play();else au.pause();
  });
}
})();
</script>
