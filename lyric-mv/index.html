<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>迷人的危险 · 歌词动画</title>
<style>
@font-face{font-family:'LJBlack';src:url(fonts/black.woff2) format('woff2');font-weight:900}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0}
canvas{width:1920px;height:1080px;display:block;cursor:pointer}
#go{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);padding:22px 64px;border-radius:14px;background:#c8553d;color:#efe4d6;font:900 48px 'LJBlack',sans-serif;pointer-events:none}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas><div id="go">▶ 点击播放</div></div>
<audio id="au" src="song.mp3" preload="auto"></audio>
<script src="data.js"></script>
<script>
(()=>{
/* 完整版(0:00–1:15):每句歌词是一个满屏页面,页面在一张大画布上排成网格;
   镜头停下时画面里只有这一页,换页时跟着歌词里的动作走(滑下去、撞飞、踢走、掉下去、劈开、溢出、淹没) */
const W=1920,H=1080,START=0,END=75,DUR_ALL=75;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FONT='"LJBlack","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif';
const MONO='"Consolas","WenQuanYi Zen Hei Mono","Courier New",monospace';
const C={ink:'#2b211c',paper:'#efe4d6',orange:'#c8553d',teal:'#2f6f73',red:'#b8322a',gray:'#9a8b7e',gap:'#1e1714'};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eOut=t=>1-Math.pow(1-t,3);
const eIn=t=>t*t*t;
const eIO=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eBack=t=>{const c=1.9,x=t-1;return 1+(c+1)*x*x*x+c*x*x;};
const rnd=seed=>{let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};};
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function beatInfo(t){const B=BEATS;if(t<B[0])return{i:-1,ph:1,pulse:0};let lo=0,hi=B.length-1;
  while(lo<hi){const m=(lo+hi+1)>>1;if(B[m]<=t)lo=m;else hi=m-1;}const iv=(B[lo+1]||B[lo]+0.44)-B[lo],ph=clamp((t-B[lo])/iv);return{i:lo,ph,pulse:Math.exp(-ph*5)};}

/* ---------- 演唱时间 ---------- */
const TM=LYRICS.map((ly,i)=>{
  const flat=ly.s.replace(/\s/g,''),n=flat.length,nextT=LYRICS[i+1]?LYRICS[i+1].t:206;
  const t1=nextT-ly.t<=7.6?nextT:ly.t+6.4;
  const pause=[];{let g=0,sp=false;for(const c of ly.s){if(/\s/.test(c)){sp=g>0;continue;}pause[g++]=sp;sp=false;}}
  const u=[];{let a=0;for(let g=0;g<n;g++){if(pause[g])a+=1.2;u[g]=a;a+=1;}}
  const U=u[n-1]+1,sing=clamp(Math.min(t1-ly.t-0.45,U*0.34),0.4,99);
  return{t0:ly.t,t1,flat,tr:u.map(x=>sing*x/U)};
});
const gt=(i,sub)=>TM[i].t0+TM[i].tr[TM[i].flat.indexOf(sub)];

/* ---------- 页面:每句一页,世界坐标里互相隔开 ---------- */
const SALMON='#e3a38f';
const pg=(col,row,bg,dark,big)=>({ox:col*2400,oy:row*1400,bg,dark,big});
const PAGES=[
  pg(0,0,C.ink,1,'泪'),pg(0,1,C.paper,0,'朋'),pg(0,2,SALMON,0,'滚'),pg(1,2,C.teal,1,'配'),pg(1,1,C.ink,1,'痛'),   // 主歌 0-4
  pg(2,1,C.orange,1,'险'),pg(2,2,C.paper,0,'缺'),pg(3,2,C.ink,1,'痛'),pg(3,1,C.teal,1,'悲'),                     // 副歌 5-8
  pg(4,0,C.paper,0,'等'),pg(4,1,'#e8dccb',0,'淹'),pg(4,2,C.teal,1,'结'),                                          // 副歌 9-11
  pg(0,-2,C.ink,1,''),pg(0,-1,C.ink,1,''),                                                                        // 开场 12 终端 / 13 播放器
];
const G=[
  {p:0,l:0,s:'当你的',x:280,y:330,size:190,enter:'slideL'},
  {p:0,l:0,s:'泪水',x:280,y:610,size:300,enter:'drop',marker:1},
  {p:0,l:0,s:'滑过侧脸',x:900,y:640,size:170,enter:'slideL',slide:1},
  {p:1,l:1,s:'我只能像朋友地',x:240,y:360,size:150,enter:'slideL'},
  {p:1,l:1,s:'体贴',x:240,y:570,size:110,enter:'drop',plate:1},
  {p:2,l:2,s:'想揍他一拳',x:220,y:330,size:175,enter:'punchR'},
  {p:2,l:2,s:'更想叫他',x:220,y:600,size:175,enter:'slideL'},
  {p:2,l:2,s:'滚远',x:220+4*172,y:600,size:175,enter:'scaleIn',solid:1,fly:1},
  {p:3,l:3,s:'他',x:260,y:330,size:170,enter:'drop',knock:1},
  {p:3,l:3,s:'不配',x:640,y:400,size:270,enter:'slam'},
  {p:3,l:3,s:'站在你眼前',x:260,y:720,size:150,enter:'slideL',plate:1},
  {p:4,l:4,s:'你的',x:280,y:340,size:280,enter:'drop'},
  {p:4,l:4,s:'痛怎能看不见',x:280,y:690,size:250,enter:'slideL',circle:1},
  {p:5,l:5,s:'为什么',x:240,y:300,size:140,enter:'slideL'},
  {p:5,l:5,s:'最迷人的',x:240,y:500,size:190,enter:'drop'},
  {p:5,l:5,s:'最危险',x:240,y:790,size:300,enter:'scaleIn',solid:1},
  {p:6,l:6,s:'为什么',x:240,y:260,size:140,enter:'slideL'},
  {p:6,l:6,s:'爱会让人变',x:240,y:480,size:180,enter:'punchR',acc:[0,1]},
  {p:6,l:6,s:'残缺',x:240,y:790,size:320,enter:'drop',solid:1,crack:1},
  {p:7,l:7,s:'为什么',x:240,y:300,size:170,enter:'slideL'},
  {p:7,l:7,s:'那么',x:240,y:600,size:230,enter:'drop'},
  {p:7,l:7,s:'痛',x:1060,y:560,size:420,enter:'slam'},
  {p:8,l:8,s:'还敢拿胸口',x:240,y:290,size:170,enter:'punchR'},
  {p:8,l:8,s:'再挡',x:240,y:530,size:170,enter:'slideL',plate:1},
  {p:8,l:8,s:'锐利伤悲',x:240,y:800,size:260,enter:'scaleIn',solid:1},
  {p:9,l:9,s:'我的心已经',x:240,y:250,size:150,enter:'slideL'},
  {p:9,l:9,s:'等你好多年',x:240,y:470,size:200,enter:'drop',acc:[2,3]},
  {p:10,l:10,s:'爱不说满到',x:240,y:280,size:170,enter:'slideL',acc:[0,1]},
  {p:10,l:10,s:'自己快淹灭',x:240,y:520,size:220,enter:'drop',acc:[3,2]},
  {p:11,l:11,s:'那是无法解释',x:420,y:500,size:130,enter:'slideL'},
  {p:11,l:11,s:'矛盾的死结',x:420,y:710,size:170,enter:'slideL',acc:[3,2]},
];
G.forEach((g,k)=>{g.ta=gt(g.l,g.s)-0.04;g.no=k+1;});
const PUNCH_T=G[5].ta+0.18,KNOCK_T=G[9].ta+0.16,FLY_T=G[7].ta+0.4;
const SLIDE_T=gt(1,'我只能像朋友地')-0.85,DROP_T=PUNCH_T+0.25,ZOOM_T=gt(4,'你的')-0.45;
// 副歌的换页时间
const RING_T=TM[5].t0-0.7,DROP5_T=TM[6].t0-0.8,CRACK_T=gt(6,'残缺')+0.25,FLY6_T=TM[7].t0-0.62,STAMP_T=G[21].ta+0.16,
  WHIP7_T=TM[8].t0-0.3,SLASH_T=TM[9].t0-0.85,POUR_T=TM[10].t0-0.9,DIVE_T=TM[11].t0-0.8,MAP_T=TM[11].t1,PLAY_T=5.0,VINYL={x:560,y:-1400+520};

/* ---------- 镜头关键帧:停在页面上时只有这一页;转场时跟着元素走 ---------- */
const PC=k=>[PAGES[k].ox+W/2,PAGES[k].oy+H/2];
const MAPC=[2160,1940],MAPALL=[5760,540];
const CAMK=[
  [0,...PC(12),1.0],[3.5,...PC(12),1.04],[4.1,...PC(13),1.0],                // 开场:终端 → 播放器
  [16.8,...PC(13),1.06],[17.6,VINYL.x,VINYL.y,3.6],[18.05,...PC(0),1.03],    // 冲进唱片中心,穿出来是第一页
  [SLIDE_T,...PC(0),1.06],
  [SLIDE_T+0.85,...PC(1),1.03],[DROP_T,...PC(1),1.06],       // 跟着“滑过侧脸”往下 → 第二页
  [DROP_T+0.6,...PC(2),1.03],[FLY_T,...PC(2),1.06],          // 跟着“想揍他一拳”掉下去 → 第三页
  [FLY_T+0.55,...PC(3),1.03],[ZOOM_T,...PC(3),1.07],         // 追着“滚远”甩过去 → 第四页
  [ZOOM_T+0.6,MAPC[0],MAPC[1],0.25],[ZOOM_T+0.85,MAPC[0],MAPC[1],0.25], // 拉远:主歌五页一起出现
  [ZOOM_T+1.5,...PC(4),1.03],[RING_T,...PC(4),1.07],         // 推进到“痛”
  [RING_T+0.65,...PC(5),1.03],[DROP5_T+0.1,...PC(5),1.06],   // 圈扩成橙色 → 最危险
  [DROP5_T+0.75,...PC(6),1.03],[FLY6_T,...PC(6),1.06],       // “最危险”掉下去 → 残缺
  [FLY6_T+0.6,...PC(7),1.03],[WHIP7_T,...PC(7),1.05],        // “残缺”飞出去 → 那么痛
  [WHIP7_T+0.3,...PC(8),1.03],[SLASH_T+0.2,...PC(8),1.06],   // 冲击波往上甩 → 锐利伤悲
  [SLASH_T+0.85,...PC(9),1.03],[POUR_T+0.2,...PC(9),1.06],   // 顺着刀口斜飞 → 等你好多年
  [POUR_T+0.9,...PC(10),1.03],[DIVE_T+0.2,...PC(10),1.06],   // 进度条溢出往下流 → 淹灭
  [DIVE_T+0.8,...PC(11),1.03],[MAP_T,...PC(11),1.07],        // 潜进水里 → 死结
  [MAP_T+1.0,MAPALL[0],MAPALL[1],0.152],[END,MAPALL[0],MAPALL[1],0.142]]; // 结尾:全片所有页面铺满一面墙
function cam(t){
  let k=0;while(k<CAMK.length-2&&CAMK[k+1][0]<=t)k++;
  const a=CAMK[k],b=CAMK[k+1],p=eIO(clamp((t-a[0])/(b[0]-a[0])));
  const moving=Math.hypot(a[1]-b[1],a[2]-b[2])>1;
  const z=moving?Math.exp(lerp(Math.log(a[3]),Math.log(b[3]),p)):lerp(a[3],b[3],clamp((t-a[0])/(b[0]-a[0])));
  const dr=moving?0:1;
  const x=lerp(a[1],b[1],p)+Math.sin(t*0.6)*6*dr,y=lerp(a[2],b[2],p)+Math.cos(t*0.5)*4*dr;
  let pk=0,best=1e18;PAGES.forEach((P,i)=>{const d=Math.hypot(P.ox+W/2-x,P.oy+H/2-y);if(d<best){best=d;pk=i;}});
  return{x,y,z,k:pk};
}

/* ---------- 绘图工具 ---------- */
const SH=dark=>dark?'rgba(0,0,0,.32)':'rgba(43,33,28,.22)';
function shapeAt(type,x,y,sz,col,rot,lw){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.lineCap='round';
  switch(type){
    case 0:ctx.beginPath();ctx.arc(0,0,sz/2,0,6.283);ctx.fill();break;
    case 1:ctx.beginPath();ctx.arc(0,0,sz/2,0,6.283);ctx.stroke();break;
    case 2:ctx.fillRect(-sz/2,-sz/2,sz,sz);break;
    case 3:ctx.beginPath();ctx.moveTo(0,-sz/2);ctx.lineTo(sz/2,sz/2);ctx.lineTo(-sz/2,sz/2);ctx.closePath();ctx.stroke();break;
    case 4:ctx.fillRect(-sz/2,-sz/7,sz,sz*2/7);ctx.fillRect(-sz/7,-sz/2,sz*2/7,sz);break;
    case 5:ctx.beginPath();for(let k=0;k<=6;k++)ctx.lineTo(-sz/2+k*sz/6,k%2?-sz/5:sz/5);ctx.stroke();break;
  }
  ctx.restore();
}
function shadowShape(type,x,y,sz,col,rot,lw,dark){shapeAt(type,x+10,y+10,sz,SH(dark),rot,lw);shapeAt(type,x,y,sz,col,rot,lw);}
function bigOutline(txt,x,y,size,col){ctx.save();ctx.font=`900 ${size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle=col;ctx.lineWidth=12;ctx.strokeText(txt,x,y);ctx.restore();}
const mix=(a,b,k)=>{const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),A=p(a),B=p(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],k)).toString(16).padStart(2,'0')).join('');};
const tone=P=>P.dark?mix(P.bg,'#ffffff',0.07):mix(P.bg,'#000000',0.06);

/* ---------- 每页的拼贴小物件(自动避开歌词) ---------- */
const LABELS=['SIDE A','TRACK 05','136 BPM','REC ●','DF-01','STEREO','NO.05','LIVE'];
const AVOID={1:[[1000,640,900,300],[300,700,1000,240],],2:[[1300,240,520,200]],3:[[1180,700,600,260],[1300,60,600,520]],0:[[1250,500,200,500]],
  5:[[1000,40,920,200],[880,880,1040,200]],6:[[1100,150,720,700]],7:[[860,220,960,680]],9:[[100,620,1740,300]],10:[[0,560,1920,520]],11:[[240,260,1440,680]],12:[[0,0,1920,1080]],13:[[200,160,1540,720]]};
const COLLAGE=PAGES.map((P,pi)=>{
  const r=rnd(2024+pi),keep=[],avoid=(AVOID[pi]||[]).slice();
  G.filter(g=>g.p===pi).forEach(g=>{const w=[...g.s].length*g.size*0.98;avoid.push([g.x-90,g.y-g.size*0.95,w+180,g.size*1.9]);});
  const hit=(x,y,w,h)=>avoid.some(([ax,ay,aw,ah])=>x<ax+aw&&x+w>ax&&y<ay+ah&&y+h>ay)||keep.some(k=>x<k.x+k.w+110&&x+w+110>k.x&&y<k.y+k.h+110&&y+h+110>k.y);
  for(let n=0;n<3000&&keep.length<18;n++){
    const type=[0,2,3,4,6,7,8,10][Math.floor(r()*8)],w=type===2?170:type===6?150:type===7?180:90,h=type===2?54:type===6?110:type===7?56:90;
    const x=60+r()*(W-120-w),y=70+r()*(H-160-h);if(hit(x,y,w,h))continue;
    keep.push({x,y,w,h,type,rot:(r()-0.5)*0.5,lab:LABELS[Math.floor(r()*LABELS.length)],ph:r()*6});
  }
  return keep;
});
function collage(P,pi,t,be){
  const dark=P.dark,fg=dark?C.paper:C.ink,acc=pi===3?C.orange:dark?C.orange:C.teal;
  for(const it of COLLAGE[pi]){
    const bob=Math.sin(t*0.8+it.ph)*6,pop=(it.type===3||it.type===8)?1+0.18*be.pulse:1;
    ctx.save();ctx.translate(it.x+it.w/2,it.y+it.h/2+bob);ctx.rotate(it.rot);ctx.scale(pop,pop);ctx.translate(-it.w/2,-it.h/2);
    const w=it.w,h=it.h;ctx.globalAlpha=0.9;
    switch(it.type){
      case 0:ctx.strokeStyle=fg;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,30);ctx.lineTo(0,0);ctx.lineTo(30,0);ctx.moveTo(w,h-30);ctx.lineTo(w,h);ctx.lineTo(w-30,h);
        ctx.moveTo(w/2-14,h/2);ctx.lineTo(w/2+14,h/2);ctx.moveTo(w/2,h/2-14);ctx.lineTo(w/2,h/2+14);ctx.stroke();break;
      case 2:ctx.fillStyle=SH(dark);ctx.beginPath();ctx.roundRect(6,6,w,h,h/2);ctx.fill();ctx.fillStyle=acc;ctx.beginPath();ctx.roundRect(0,0,w,h,h/2);ctx.fill();
        ctx.fillStyle='#fff';ctx.font=`700 24px ${MONO}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.lab,w/2,h/2+1);break;
      case 3:{const R=w/2;ctx.translate(R,R);ctx.rotate(t*0.4);const star=()=>{ctx.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2,rr=k%2?R*0.45:R;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();};
        ctx.translate(6,6);star();ctx.fillStyle=SH(dark);ctx.fill();ctx.translate(-6,-6);star();ctx.fillStyle=pi===0||pi===4?C.orange:dark?C.paper:C.orange;ctx.fill();break;}
      case 4:ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(0,h*0.38);ctx.lineTo(w*0.55,h*0.38);ctx.lineTo(w*0.55,h*0.15);ctx.lineTo(w,h/2);ctx.lineTo(w*0.55,h*0.85);ctx.lineTo(w*0.55,h*0.62);ctx.lineTo(0,h*0.62);ctx.closePath();ctx.fill();break;
      case 6:ctx.save();ctx.beginPath();ctx.rect(0,0,w,h);ctx.clip();ctx.strokeStyle=acc;ctx.lineWidth=10;for(let x=-h;x<w+h;x+=24){ctx.beginPath();ctx.moveTo(x,h);ctx.lineTo(x+h,0);ctx.stroke();}ctx.restore();
        ctx.strokeStyle=fg;ctx.lineWidth=4;ctx.strokeRect(0,0,w,h);break;
      case 7:ctx.fillStyle=dark?'rgba(239,228,214,.28)':'rgba(43,33,28,.18)';ctx.beginPath();ctx.moveTo(0,0);for(let k=0;k<=4;k++)ctx.lineTo(w,k*h/4+(k%2?6:0));ctx.lineTo(0,h);for(let k=4;k>=0;k--)ctx.lineTo(k%2?-6:0,k*h/4);ctx.closePath();ctx.fill();break;
      case 8:ctx.fillStyle=acc;ctx.font=`900 88px ${FONT}`;ctx.textBaseline='top';ctx.fillText('♪',0,0);break;
      case 10:ctx.fillStyle=fg;for(let k=0;k<16;k++){const a=k/16*6.283+t*0.3;ctx.beginPath();ctx.arc(w/2+Math.cos(a)*w*0.42,h/2+Math.sin(a)*h*0.42,4,0,6.283);ctx.fill();}break;
    }
    ctx.restore();
  }
}
/* 每页边缘的几何图形 */
const ANCH=[[150,170],[W-170,150],[W-130,H/2+60],[170,H-170],[W-330,H-150],[W/2+380,110]];
function shapes(P,pi,t,be){
  const r=rnd(pi*17+5),cols=P.dark?[C.orange,C.teal===P.bg?C.paper:C.teal,C.paper]:[C.orange,C.teal,C.ink];
  ANCH.forEach(([x,y],k)=>{const type=Math.floor(r()*6),sz=50+r()*70,dir=r()<0.5?-1:1,ph=r()*6;
    shadowShape(type,x+Math.sin(t*0.7+ph)*14,y+Math.cos(t*0.6+ph)*12,sz*(1+0.15*be.pulse),cols[k%3],t*0.5*dir+ph,Math.max(7,sz*0.12),P.dark);});
}

/* ---------- 页面背景和各页的专属道具 ---------- */
function pageBack(P,pi,t,be,c){
  ctx.fillStyle=P.bg;ctx.fillRect(0,0,W,H);
  // 后景:大色块和巨型描边字,随镜头轻微视差
  const px=(c.x-(P.ox+W/2))*0.35,py=(c.y-(P.oy+H/2))*0.35;
  ctx.fillStyle=tone(P);ctx.beginPath();ctx.arc(W*0.72+px,H*0.35+py,430,0,6.283);ctx.fill();
  bigOutline(P.big,W*0.66+px*1.2,H*0.52+py*1.2,980,tone(P));
  if(!P.dark){ctx.fillStyle='rgba(43,33,28,.12)';for(let x=22;x<W;x+=44)for(let y=22;y<H;y+=44)ctx.fillRect(x,y,5,5);}
  if(pi===0){const r=rnd(5);for(let k=0;k<10;k++){const x=120+k*190+r()*60,len=60+(t-17)*(14+r()*24)+r()*120,col=k%3?tone(P):C.orange;

  chars.forEach((c,j)=>{
    const cx=adv*(j+0.5);
    const accOn=g.acc&&j>=g.acc[0]&&j<g.acc[0]+g.acc[1];
    if(g.solid){ctx.fillStyle=C.ink;for(let d=12;d>=1;d--)ctx.fillText(c,cx+d,d);ctx.fillStyle=(P.bg===SALMON||P.bg===C.orange)?C.paper:C.orange;}
    else{
      if(!g.plate&&g.enter!=='slam'&&!(g.marker&&a>0.3)){ctx.fillStyle=SH(dark);ctx.fillText(c,cx+Math.max(6,g.size*0.045),Math.max(6,g.size*0.045));}
      ctx.fillStyle=g.enter==='slam'?C.red:g.plate?(dark?C.ink:C.paper):g.marker&&a>0.3?C.paper:(g.circle&&j===0)||accOn?(P.bg===C.orange?C.paper:C.orange):face;
    }
    if(g.crack&&t>CRACK_T){ // 横向切开错位
      const k=eOut(clamp((t-CRACK_T)/0.25))*g.size*0.1,fill=ctx.fillStyle;
      for(const[sgn,top]of[[-1,1],[1,0]]){ctx.save();ctx.beginPath();ctx.rect(cx-g.size,top?-g.size:g.size*0.04,g.size*2,g.size*0.96);ctx.clip();
        ctx.fillStyle=C.ink;for(let d=12;d>=1;d--)ctx.fillText(c,cx+sgn*k+d,d);ctx.fillStyle=fill;ctx.fillText(c,cx+sgn*k,0);ctx.restore();}
    }else ctx.fillText(c,cx,0);
  });
  if(g.circle){const e=eOut(clamp((a-0.25)/0.35));if(e>0){ctx.strokeStyle=C.orange;ctx.lineWidth=g.size*0.06;ctx.lineCap='round';ctx.beginPath();
    for(let q=0;q<=60*e;q++){const an=-2.4+q/60*6.283*1.12,wb=1+0.04*Math.sin(q*0.7);ctx.lineTo(adv/2+Math.cos(an)*adv*0.85*wb,Math.sin(an)*g.size*0.78*wb);}ctx.stroke();}}
  ctx.restore();
}
function drawGroup(g,P,t){
  if(t<g.ta)return;
  const a=t-g.ta,adv=g.size*0.98,chars=[...g.s],w=chars.length*adv;
  // 关键词描边回声
  if((g.solid||g.marker||g.enter==='slam'||g.circle)&&a>0.3&&!(g.fly&&t>FLY_T)){const P0=pose(g,t),e=eOut(clamp((a-0.3)/0.4));
    ctx.save();ctx.font=`900 ${g.size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle=g.enter==='slam'?C.red:P.dark?C.orange:C.teal;ctx.lineWidth=3;
    for(let k=3;k>=1;k--){ctx.save();ctx.globalAlpha=0.5/k*e;ctx.translate(P0.x+w/2+k*22*e,P0.y+k*22*e);ctx.rotate(P0.rot+(g.enter==='slam'?-0.12:0));ctx.translate(-w/2,0);chars.forEach((c,j)=>ctx.strokeText(c,adv*(j+0.5),0));ctx.restore();}ctx.restore();}
  // 运动拖影
  if(g.slide||g.fly||g.enter==='punchR'){
    for(let k=3;k>=1;k--){const A=pose(g,t-0.045*k),B=pose(g,t);if(Math.hypot(A.x-B.x,A.y-B.y)<6)continue;
      ctx.save();ctx.globalAlpha=0.35/k;ctx.translate(A.x+w/2,A.y);ctx.rotate(A.rot);ctx.scale(A.s*A.sx,A.s*A.sy);ctx.translate(-w/2,0);
      ctx.font=`900 ${g.size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle=g.fly?C.ink:(P.dark?C.paper:C.ink);ctx.lineWidth=4;
      chars.forEach((c,j)=>ctx.strokeText(c,adv*(j+0.5),0));ctx.restore();}
  }
  drawText(g,P,t);
  burst(g.x+w/2,g.y,a-(g.enter==='punchR'?0.18:g.enter==='slam'?0.16:0.3),g.enter==='slam'?C.red:C.orange,g.ta*100|0);
}
const TRAVEL=new Set([2,5,7,15,18]); // 滑过侧脸 / 想揍他一拳 / 滚远 / 最危险 / 残缺
function worldPose(g,t){
  const P=PAGES[g.p],gi=G.indexOf(g);
  if(gi===2){ // 滑过侧脸:在第一页里往下滑,转场时带着镜头滑进第二页,随即从右下方滑出并淡掉
    const P1=PAGES[1];
    if(t<=SLIDE_T){const q=pose(g,t);return{...q,x:q.x+P.ox,y:q.y+P.oy};}
    const q0=pose(g,SLIDE_T),sx0=q0.x+P.ox,sy0=q0.y+P.oy,f=clamp((t-SLIDE_T)/0.85);
    const ex=P1.ox+2050,ey=P1.oy+760;
    return{x:lerp(sx0,ex,eIn(f)*0.55+f*0.45),y:lerp(sy0,ey,eIO(f)),s:1,sx:1,sy:1,rot:lerp(q0.rot,0.35,f),al:1-clamp((f-0.6)/0.35)};}
  if(gi===5){ // 想揍他一拳:砸进第二页撞飞开关,再掉进第三页
    const P1=PAGES[1],q=pose(g,t),a={x:P1.ox+400+(q.x-g.x),y:P1.oy+820};
    if(t<DROP_T)return{...q,x:a.x,y:a.y};
    const f=eIO(clamp((t-DROP_T)/0.6));return{x:lerp(a.x,P.ox+g.x,f),y:lerp(a.y,P.oy+g.y,f),s:1,sx:1,sy:1,rot:Math.sin(f*Math.PI)*0.12,al:1};}
  if(gi===7){ // 滚远:被踢出第三页,飞进第四页右下角撞住
    const q=pose(g,t),f=t-FLY_T,P3=PAGES[3];
    if(f<=0)return{...q,x:q.x+P.ox,y:q.y+P.oy};
    const p=clamp(f/0.55),x=lerp(P.ox+g.x,P3.ox+1340,eIn(p)*0.85+p*0.15),y=lerp(P.oy+g.y,P3.oy+830,p*p);
    const b=clamp((f-0.55)/0.4);return{x:x,y:y-(p>=1?Math.sin(b*Math.PI)*60*(1-b):0),s:1,sx:1,sy:1,rot:p<1?p*1.2:lerp(1.2,0.2,eOut(b)),al:1};}
  if(gi===15){ // 最危险:掉出橙色页,落进下一页后淡掉
    const q=pose(g,t),f=clamp((t-DROP5_T)/0.85);if(f<=0)return{...q,x:q.x+P.ox,y:q.y+P.oy};
    return{...q,x:q.x+P.ox+f*160,y:q.y+P.oy+eIn(f)*1500,rot:q.rot+f*0.35,al:1-clamp((f-0.65)/0.3)};}
  if(gi===18){ // 残缺:裂开后飞向右边一页,随即淡掉
    const q=pose(g,t),f=clamp((t-FLY6_T)/0.75);if(f<=0)return{...q,x:q.x+P.ox,y:q.y+P.oy};
    return{...q,x:q.x+P.ox+eIn(f)*2600,y:q.y+P.oy-Math.sin(f*Math.PI)*120,rot:q.rot+f*0.5,al:1-clamp((f-0.7)/0.25)};}
  const q=pose(g,t);return{...q,x:q.x+P.ox,y:q.y+P.oy};
}
function drawTraveler(g,t){
  if(t<g.ta)return;
  const gi=G.indexOf(g),P=PAGES[gi===7&&t>FLY_T+0.3?3:gi===5&&t<DROP_T+0.3?1:gi===2&&t>SLIDE_T+0.5?1:g.p];
  const adv=g.size*0.98,w=[...g.s].length*adv;
  for(let k=3;k>=1;k--){const A=worldPose(g,t-0.045*k),B=worldPose(g,t);if(Math.hypot(A.x-B.x,A.y-B.y)<6)continue;
    ctx.save();ctx.globalAlpha=0.35/k*A.al;ctx.translate(A.x+w/2,A.y);ctx.rotate(A.rot);ctx.translate(-w/2,0);ctx.font=`900 ${g.size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.strokeStyle=P.dark?C.paper:C.ink;ctx.lineWidth=4;[...g.s].forEach((c,j)=>ctx.strokeText(c,adv*(j+0.5),0));ctx.restore();}
  drawText(g,P,t,{pose:worldPose(g,t),label:[2,5].includes(G.indexOf(g))});
  const a=t-g.ta;if(G.indexOf(g)===5)burst(PAGES[1].ox+400+w,PAGES[1].oy+820,t-PUNCH_T,C.orange,77);
  else burst(worldPose(g,t).x+w/2,worldPose(g,t).y,a-0.3,C.orange,g.ta*100|0);
}

/* ---------- 一帧 ---------- */
function renderAt(t){
  t=clamp(t,START,END);const be=beatInfo(t),c=cam(t),c0=cam(t-1/30);
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  ctx.fillStyle=C.gap;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(c.z,c.z);ctx.translate(-c.x,-c.y);
  const vx0=c.x-W/2/c.z,vx1=c.x+W/2/c.z,vy0=c.y-H/2/c.z,vy1=c.y+H/2/c.z;
  PAGES.forEach((P,pi)=>{
    if(P.ox>vx1||P.ox+W<vx0||P.oy>vy1||P.oy+H<vy0)return;
    ctx.save();ctx.translate(P.ox,P.oy);ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
    pageBack(P,pi,t,be,c);
    if(pi===1)toggle(t);
    G.filter(g=>g.p===pi&&!TRAVEL.has(G.indexOf(g))).forEach(g=>drawGroup(g,P,t));
    pageFront(P,pi,t,be);
    ctx.restore();
  });
  TRAVEL.forEach(i=>drawTraveler(G[i],t));
  ctx.restore();
  // 甩镜时的速度线
  const v=Math.hypot(c.x-c0.x,c.y-c0.y)*c.z;
  if(v>30){const r=rnd(Math.floor(t*30)),n=Math.min(50,v/3),ang=Math.atan2(c.y-c0.y,c.x-c0.x);ctx.save();ctx.translate(W/2,H/2);ctx.rotate(ang);
    ctx.strokeStyle='rgba(239,228,214,.55)';ctx.lineWidth=4;for(let k=0;k<n;k++){const y=(r()-0.5)*H*1.6,x=(r()-0.5)*W*1.6,l=v*3*(0.5+r());ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+l,y);ctx.stroke();}ctx.restore();}
  // 界面
  const P=PAGES[c.k],ink=P.dark?C.paper:C.ink;
  ctx.fillStyle=ink;ctx.globalAlpha=0.6;ctx.font=`900 22px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';
  for(let k=0;k<3;k++){const vv=0.35+0.65*Math.abs(Math.sin(t*3+k*1.7))*(0.4+0.6*be.pulse);ctx.fillRect(40+k*9,44-vv*22,5,vv*22);}
  ctx.fillText('迷人的危险 — Dance Flow',78,34);
  ctx.font=`700 20px ${MONO}`;ctx.fillText(fmt(t)+' / '+fmt(DUR_ALL),40,H-44);
  ctx.globalAlpha=0.18;ctx.fillRect(40,H-24,W-80,4);ctx.globalAlpha=0.85;ctx.fillRect(40,H-24,(W-80)*t/DUR_ALL,4);ctx.globalAlpha=1;
  if(t>MAP_T+0.6){ // 结尾:全片页面铺满一面墙,中间浮出标题
    const p=eOut(clamp((t-MAP_T-0.6)/0.5));ctx.save();ctx.globalAlpha=p;ctx.translate(W/2,H/2);ctx.scale(lerp(0.9,1,p),lerp(0.9,1,p));
    ctx.fillStyle='#000';ctx.beginPath();ctx.roundRect(-520+16,-200+16,1040,400,28);ctx.fill();ctx.fillStyle=C.paper;ctx.beginPath();ctx.roundRect(-520,-200,1040,400,28);ctx.fill();
    ctx.font=`900 150px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=C.ink;for(let d=10;d>=1;d--)ctx.fillText('迷人的危险',d,-40+d);ctx.fillStyle=C.orange;ctx.fillText('迷人的危险',0,-40);
    ctx.fillStyle=C.ink;ctx.font=`900 50px ${FONT}`;ctx.fillText('Dance Flow',0,110);ctx.restore();}
  const f=Math.max(clamp(1-(t-START)/0.4),clamp((t-END+1.6)/1.6));if(f>0){ctx.fillStyle=`rgba(0,0,0,${f})`;ctx.fillRect(0,0,W,H);}
}
window.renderAt=renderAt;

const rec=/[?&]record/.test(location.search),stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(${-W*s/2}px,${-H*s/2}px) scale(${s})`;}
addEventListener('resize',fit);fit();
window.ready=document.fonts.load('900 100px LJBlack').then(()=>document.fonts.ready).then(()=>{renderAt(START);return true;});
const go=document.getElementById('go');
if(rec){go.remove();stage.style.transform='none';stage.style.left=stage.style.top='0';}
else{
  const au=document.getElementById('au');let raf=0;
  const loop=()=>{const t=au.currentTime;if(t>=END){au.pause();renderAt(END);return;}renderAt(t);raf=requestAnimationFrame(loop);};
  cv.addEventListener('click',()=>{go.style.display='none';if(au.paused){if(au.currentTime<START||au.currentTime>=END)au.currentTime=START;au.play();loop();}else{au.pause();cancelAnimationFrame(raf);}});
}
})();
</script>
