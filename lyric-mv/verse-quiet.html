<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>迷人的危险 · 主歌样片(克制版)</title>
<style>
@font-face{font-family:'LJSerifLight';src:url(fonts/serif-light.woff2) format('woff2')}
@font-face{font-family:'LJSerifBold';src:url(fonts/serif-semibold.woff2) format('woff2')}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0}
canvas{width:1920px;height:1080px;display:block;cursor:pointer}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<audio id="au" src="song.mp3" preload="auto"></audio>
<script src="data.js"></script>
<script>
(()=>{
/* 克制版:深色留白 + 宋体排版 + 一根贯穿全段的细线
   细线经过每一句时变成那一句的意象,镜头沿着线缓慢平移 */
const W=1920,H=1080,START=17.3,END=44.8,DUR_ALL=75;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const LIGHT='"LJSerifLight","Noto Serif SC","Songti SC",serif',BOLD='"LJSerifBold","Noto Serif SC","Songti SC",serif';
const C={bg:'#1b1512',text:'#efe4d6',dim:'#8c7f73',acc:'#c8553d',line:'rgba(239,228,214,.75)'};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eOut=t=>1-Math.pow(1-t,3);
const eIO=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eSine=t=>0.5-0.5*Math.cos(Math.PI*clamp(t));
const rnd=seed=>{let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};};
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};

/* ---------- 演唱时间(和完整版同一套算法) ---------- */
const TM=LYRICS.map((ly,i)=>{
  const flat=ly.s.replace(/\s/g,''),n=flat.length,nextT=LYRICS[i+1]?LYRICS[i+1].t:206;
  const t1=nextT-ly.t<=7.6?nextT:ly.t+6.4;
  const pause=[];{let g=0,sp=false;for(const c of ly.s){if(/\s/.test(c)){sp=g>0;continue;}pause[g++]=sp;sp=false;}}
  const u=[];{let a=0;for(let g=0;g<n;g++){if(pause[g])a+=1.2;u[g]=a;a+=1;}}
  const U=u[n-1]+1,sing=clamp(Math.min(t1-ly.t-0.45,U*0.34),0.4,99);
  return{t0:ly.t,t1,flat,tr:u.map(x=>sing*x/U)};
});
const gt=(i,sub)=>TM[i].t0+TM[i].tr[TM[i].flat.indexOf(sub)];

/* ---------- 每句一个构图,沿 x 方向排开;关键词大、其余小 ---------- */
const SP=2000; // 两句之间的距离
const LINES=[
  {cx:0,groups:[{s:'当你的',x:-560,y:-150,k:0},{s:'泪水',x:-590,y:60,k:1},{s:'滑过侧脸',x:-80,y:180,k:0}]},
  {cx:SP,groups:[{s:'我只能像',x:-640,y:-170,k:0},{s:'朋友',x:-660,y:30,k:1},{s:'地体贴',x:-120,y:150,k:0}]},
  {cx:SP*2,groups:[{s:'想揍他一拳',x:-640,y:-200,k:0},{s:'更想叫他',x:-640,y:-60,k:0},{s:'滚远',x:-100,y:90,k:1,drift:1}]},
  {cx:SP*3,groups:[{s:'他',x:-600,y:-170,k:0},{s:'不配',x:-630,y:30,k:1},{s:'站在你眼前',x:-110,y:150,k:0}]},
  {cx:SP*4,groups:[{s:'你的',x:-520,y:-170,k:0},{s:'痛',x:-540,y:40,k:1},{s:'怎能看不见',x:-210,y:150,k:0}]},
];
LINES.forEach((L,i)=>{L.i=i;L.t0=TM[i].t0;L.t1=TM[i].t1;L.groups.forEach(g=>{g.ta=gt(i,g.s);g.size=g.k?230:72;});});

/* ---------- 镜头:每句提前 1.3 秒开始缓慢平移过去,停留时轻轻漂移推近 ---------- */
function cam(t){
  let x=-700,z=1;
  const first=LINES[0];
  if(t<first.t0-0.3)x=lerp(-900,first.cx,eSine((t-START)/(first.t0-0.3-START)));
  else{
    let k=0;while(k<LINES.length-1&&t>=LINES[k+1].t0-1.0)k++;
    const L=LINES[k],nx=L.cx,px=k?LINES[k-1].cx+120:nx;
    const pan=eIO(clamp((t-(L.t0-1.0))/1.15));
    const hold=clamp((t-L.t0)/(L.t1-L.t0));
    x=lerp(px,nx,k?pan:1)+hold*120;z=1+0.04*hold;
  }
  return{x,y:0,z};
}

/* ---------- 一根贯穿全段的细线 ---------- */
// 每段:起止时间 + 世界坐标点列,按时间进度从头画到尾
const BASE=290;
function seg(fn,n=240){const a=[];for(let k=0;k<=n;k++)a.push(fn(k/n));return a;}
const SEGS=[];
{
  // 0 泪水:沿基线走,垂下一滴泪
  const x0=-1100,xd=380;
  SEGS.push({t0:START,t1:gt(0,'泪水')+0.3,pts:seg(u=>[lerp(x0,xd,u),BASE])});
  SEGS.push({t0:gt(0,'泪水')+0.3,t1:gt(0,'滑过侧脸')+1.6,pts:seg(u=>{ // 先垂下一段,再坠成一滴泪,再收回基线
    const stem=50,r=36;
    if(u<0.25)return[xd,BASE+stem*(u/0.25)];
    if(u<0.8){const th=(u-0.25)/0.55*Math.PI*2;return[xd+r*Math.sin(th)*Math.sin(th/2),BASE+stem+r-r*Math.cos(th)];}
    return[xd,BASE+stem*(1-(u-0.8)/0.2)];
  })});
  SEGS.push({t0:gt(0,'滑过侧脸')+1.6,t1:TM[1].t0-0.1,pts:seg(u=>[lerp(xd,SP-800,u),BASE])});
  // 1 朋友:分成两条平行线(第二条单独画)
  SEGS.push({t0:TM[1].t0-0.1,t1:TM[1].t1-0.3,pts:seg(u=>[lerp(SP-800,SP*2-800,u),BASE])});
  // 2 滚远:被越拉越远,崩断
  SEGS.push({t0:TM[2].t0-0.1,t1:gt(2,'滚远'),pts:seg(u=>[lerp(SP*2-800,SP*2+420,u),BASE])});
  // 3 不配:竖起一道门
  const dx=SP*3+520;
  SEGS.push({t0:TM[3].t0-0.6,t1:TM[3].t0+0.3,pts:seg(u=>[lerp(SP*2+700,dx,u),BASE])});
  SEGS.push({t0:TM[3].t0+0.3,t1:gt(3,'站在你眼前'),pts:seg(u=>{const p=u*4;return p<1?[dx,lerp(BASE,-360,p)]:p<2?[lerp(dx,dx+260,p-1),-360]:p<3?[dx+260,lerp(-360,BASE,p-2)]:[lerp(dx+260,SP*4-900,p-3),BASE];})});
  // 4 痛:绕成一个圈把“痛”圈住
  const cx=SP*4-540+115,cy=40;
  SEGS.push({t0:TM[4].t0-0.2,t1:gt(4,'痛')-0.05,pts:seg(u=>[lerp(SP*4-900,cx-180,u),lerp(BASE,cy+60,eSine(u))])});
  SEGS.push({t0:gt(4,'痛')-0.05,t1:gt(4,'痛')+1.4,pts:seg(u=>{const a=Math.PI*0.85+u*Math.PI*2.1,r=175+10*Math.sin(u*9);return[cx+Math.cos(a)*r*1.05,cy+Math.sin(a)*r];})});
  SEGS.push({t0:gt(4,'痛')+1.4,t1:END,pts:seg(u=>[lerp(cx-170,SP*5,u),lerp(cy+60,BASE,eSine(u))])});
}
function strokePts(pts,frac){
  const n=Math.floor((pts.length-1)*frac);if(n<1)return null;
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let k=1;k<=n;k++)ctx.lineTo(pts[k][0],pts[k][1]);ctx.stroke();return pts[n];
}
function thread(t){
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=C.line;ctx.lineWidth=3;
  let tip=null;
  const snapT=gt(2,'滚远')+0.55;
  SEGS.forEach((S,k)=>{
    const f=clamp((t-S.t0)/(S.t1-S.t0));if(f<=0)return;
    if(k===4&&t>snapT){ // 崩断:断点两侧各自回弹
      const a=t-snapT,cut=SP*2+150;
      const L=S.pts.filter(p=>p[0]<cut),R=S.pts.filter(p=>p[0]>=cut);
      ctx.beginPath();L.forEach((p,j)=>{const back=Math.max(0,p[0]-(cut-260))*eOut(clamp(a/0.5))*0.9,w=Math.sin(j*0.3-a*12)*12*Math.exp(-a*3)*(p[0]>cut-400?1:0);j?ctx.lineTo(p[0]-back,p[1]+w):ctx.moveTo(p[0]-back,p[1]+w);});ctx.stroke();
      ctx.save();ctx.globalAlpha=clamp(1-a/1.2);ctx.beginPath();R.forEach((p,j)=>{const fly=eOut(clamp(a/1.2))*520,w=Math.sin(j*0.3-a*12)*14*Math.exp(-a*3);j?ctx.lineTo(p[0]+fly,p[1]+w):ctx.moveTo(p[0]+fly,p[1]+w);});ctx.stroke();ctx.restore();
      return;
    }
    if(k===4&&t>gt(2,'滚远')){ // 被拉紧时轻微颤动
      const a=t-gt(2,'滚远');ctx.beginPath();S.pts.slice(0,Math.floor((S.pts.length-1)*f)+1).forEach((p,j)=>{const w=Math.sin(j*0.5+a*40)*2*a;j?ctx.lineTo(p[0],p[1]+w):ctx.moveTo(p[0],p[1]+w);});ctx.stroke();return;
    }
    const e=strokePts(S.pts,f);if(e&&f<1)tip=e;
  });
  // 朋友:第二条平行线,一直不相交
  {const f=clamp((t-gt(1,'朋友'))/(TM[1].t1-0.3-gt(1,'朋友')));if(f>0){ctx.strokeStyle='rgba(200,85,61,.85)';
    const x0=SP-700,x1=SP*2-900;ctx.beginPath();ctx.moveTo(x0,BASE+26);ctx.lineTo(lerp(x0,x1,eOut(f)),BASE+26);ctx.stroke();ctx.strokeStyle=C.line;}}
  // 不配:门缝里的光越来越窄
  {const s0=TM[3].t0+0.3+0.5,a=t-s0;if(a>0){const dx=SP*3+520,w=260*(1-eIO(clamp(a/(TM[3].t1-s0))));
    ctx.fillStyle=`rgba(239,228,214,${0.10*clamp(a/0.6)})`;ctx.fillRect(dx+(260-w)/2,-360,w,BASE+360);}}
  if(tip){ctx.fillStyle=C.text;ctx.beginPath();ctx.arc(tip[0],tip[1],5,0,6.283);ctx.fill();}
  ctx.restore();
}

/* ---------- 歌词 ---------- */
function drawGroups(t){
  LINES.forEach((L,i)=>{
    const next=LINES[i+1];
    const ghost=next?1-0.75*eSine((t-(next.t0-0.6))/1.6):1; // 下一句来时淡成残影,不切走
    L.groups.forEach(g=>{
      const a=t-g.ta+0.12;if(a<0)return;
      const p=eOut(clamp(a/0.9)),al=clamp(a/0.7)*ghost;
      const track=lerp(0.45,g.k?0.04:0.16,p); // 字距从宽慢慢收拢
      const font=g.k?BOLD:LIGHT;
      ctx.save();ctx.globalAlpha=al;ctx.font=`${g.size}px ${font}`;ctx.textBaseline='middle';ctx.textAlign='left';
      let x=L.cx+g.x,y=g.y+(1-p)*26;
      if(g.drift){const d=t-(g.ta+0.6);if(d>0){x+=eOut(clamp(d/2.4))*520;ctx.globalAlpha=al*(1-0.75*clamp(d/2.4));}}
      ctx.fillStyle=g.k?C.acc:C.text;
      for(const c of g.s){ctx.fillText(c,x,y);x+=g.size*(1+track)+(g.drift&&t>g.ta+0.6?eOut(clamp((t-g.ta-0.6)/2.4))*80:0);}
      ctx.restore();
    });
    // 小号的序号和时间码,像诗集页码
    const a=t-L.t0+0.3;if(a>0){ctx.save();ctx.globalAlpha=clamp(a/1)*ghost*0.8;ctx.fillStyle=C.dim;ctx.font=`26px ${LIGHT}`;ctx.textBaseline='middle';
      ctx.fillText(String(i+1).padStart(2,'0')+'  ·  '+fmt(L.t0),L.cx-700,-290);ctx.fillRect(L.cx-700,-262,1,150);ctx.restore();}
  });
}

/* ---------- 质感:很轻的暖光、颗粒、暗角 ---------- */
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c.getContext('2d');};
const GRAIN=[0,1,2,3].map(s=>{const g=mk(480,270),d=g.createImageData(480,270),r=rnd(s+11);
  for(let k=0;k<d.data.length;k+=4){const v=r()*255;d.data[k]=d.data[k+1]=d.data[k+2]=v;d.data[k+3]=255;}g.putImageData(d,0,0);return g.canvas;});
const VIG=(()=>{const g=mk(W,H),gr=g.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*1.0);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=gr;g.fillRect(0,0,W,H);return g.canvas;})();

function renderAt(t){
  t=clamp(t,START,END);const c=cam(t);
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  // 很淡的暖光,缓慢移动
  const lx=W*(0.25+0.1*Math.sin(t*0.07)),gr=ctx.createRadialGradient(lx,-100,0,lx,-100,1300);
  gr.addColorStop(0,'rgba(200,120,80,.13)');gr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(c.z,c.z);ctx.translate(-c.x,-c.y);
  thread(t);drawGroups(t);
  ctx.restore();
  ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=0.06;ctx.imageSmoothingEnabled=false;ctx.drawImage(GRAIN[Math.floor(t*24)%4],0,0,W,H);ctx.restore();
  ctx.drawImage(VIG,0,0);
  // 底部极简信息
  ctx.fillStyle=C.dim;ctx.globalAlpha=0.7;ctx.font=`22px ${LIGHT}`;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText('迷人的危险 · Dance Flow',60,H-56);
  ctx.textAlign='right';ctx.fillText(fmt(t)+' / '+fmt(DUR_ALL),W-60,H-56);
  ctx.globalAlpha=0.25;ctx.fillRect(60,H-30,W-120,1);ctx.globalAlpha=0.7;ctx.fillRect(60,H-30,(W-120)*t/DUR_ALL,1);ctx.globalAlpha=1;
  const f=Math.max(clamp(1-(t-START)/0.6),clamp((t-END+0.6)/0.6));if(f>0){ctx.fillStyle=`rgba(0,0,0,${f})`;ctx.fillRect(0,0,W,H);}
}
window.renderAt=renderAt;

const rec=/[?&]record/.test(location.search),stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(${-W*s/2}px,${-H*s/2}px) scale(${s})`;}
addEventListener('resize',fit);fit();
window.ready=Promise.all([document.fonts.load("72px LJSerifLight"),document.fonts.load("72px LJSerifBold")]).then(()=>document.fonts.ready).then(()=>{renderAt(START);return true;});
if(rec){stage.style.transform='none';stage.style.left=stage.style.top='0';}
else{
  const au=document.getElementById('au');let raf=0;
  const loop=()=>{const t=au.currentTime;if(t>=END){au.pause();renderAt(END);return;}renderAt(t);raf=requestAnimationFrame(loop);};
  cv.addEventListener('click',()=>{if(au.paused){if(au.currentTime<START||au.currentTime>=END)au.currentTime=START;au.play();loop();}else{au.pause();cancelAnimationFrame(raf);}});
}
})();
</script>
</body>
</html>
